<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory – Ingresos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="js/theme.js"></script>
  <script src="js/logo.js"></script>
</head>
<body>
<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <main class="main" id="main">
    <div class="page-wrapper">

      <div class="page-header">
        <div><h1>Ingresos / Pagos</h1><p>Controla los pagos y registros de ingresos.</p></div>
        <div class="page-actions">
          <button class="btn btn--outline" onclick="exportarCSV()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            Exportar
          </button>
          <button class="btn btn--primary" onclick="abrirModal()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
            Registrar Pago
          </button>
        </div>
      </div>

      <!-- KPIs -->
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--indigo"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.077 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.511-1.31c-.563-.649-1.413-1.077-2.354-1.253V5z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kTotal">—</div><div class="kpi-label">Total Cobrado</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--green"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kEsteMes">—</div><div class="kpi-label">Este Mes</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--yellow"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kPendientes">—</div><div class="kpi-label">Por Cobrar</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--blue"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kNPagos">—</div><div class="kpi-label">N° Pagos</div></div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar pago…" oninput="renderTabla()"/>
        </div>
        <select class="filter-select" id="filtroEstado" onchange="renderTabla()">
          <option value="">Todos los estados</option>
          <option>Pagado</option><option>Pendiente</option>
        </select>
        <select class="filter-select" id="filtroMetodo" onchange="renderTabla()">
          <option value="">Todos los métodos</option>
          <option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option>
        </select>
      </div>

      <!-- Tabla -->
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr><th>Código</th><th>Reserva</th><th>Cliente</th><th>Concepto</th><th>Fecha</th><th>Monto</th><th>Estado</th><th>Método</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
        <div class="tbl-pagination">
          <span id="paginacionInfo">—</span>
          <div class="pag-btns"><button class="pag-btn active">1</button></div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitulo">Registrar Pago</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Cliente</label><select class="form-select" id="fCliente"></select></div>
      <div class="form-group"><label>Reserva</label><select class="form-select" id="fReserva"></select></div>
    </div>
    <div class="form-group"><label>Concepto</label><input type="text" class="form-input" id="fConcepto" placeholder="Ej: Adelanto reserva RES-001"/></div>
    <div class="form-row">
      <div class="form-group"><label>Monto (S/) *</label><input type="number" class="form-input" id="fMonto" placeholder="0.00" min="0"/></div>
      <div class="form-group"><label>Fecha *</label><input type="date" class="form-input" id="fFecha"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Método de Pago</label><select class="form-select" id="fMetodo"><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option></select></div>
      <div class="form-group"><label>Estado</label><select class="form-select" id="fEstado"><option>Pagado</option><option>Pendiente</option></select></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn--outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn--primary" onclick="guardarPago()">Guardar Pago</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
let editandoId = null;

function poblarSelects() {
  const selCl = document.getElementById('fCliente');
  const selRe = document.getElementById('fReserva');
  selCl.innerHTML = '<option value="">— Cliente —</option>';
  selRe.innerHTML = '<option value="">— Reserva —</option>';
  Data.clientes.getAll().forEach(c => { const o = document.createElement('option'); o.value=c.id; o.textContent=c.nombre; selCl.appendChild(o); });
  Data.reservas.getAll().forEach(r => { const o = document.createElement('option'); o.value=r.id; o.textContent=`${r.codigo} · ${Data.clienteNombre(r.clienteId)}`; selRe.appendChild(o); });
}

function nextCodigo() {
  const ingresos = Data.ingresos.getAll();
  const max = ingresos.reduce((m,i) => Math.max(m, parseInt((i.codigo||'PAG-000').split('-')[1]||0)), 0);
  return 'PAG-' + String(max+1).padStart(3,'0');
}

function renderTabla() {
  const txt    = (document.getElementById('searchInput').value||'').toLowerCase();
  const estado = document.getElementById('filtroEstado').value;
  const metodo = document.getElementById('filtroMetodo').value;
  const tbody  = document.getElementById('tablaBody');

  const now = new Date(), m = now.getMonth(), y = now.getFullYear();
  const todos = Data.ingresos.getAll();
  const filtrados = todos.filter(i => {
    const search = `${i.codigo||''} ${Data.clienteNombre(i.clienteId)} ${i.concepto||''}`.toLowerCase();
    return search.includes(txt) && (!estado||i.estado===estado) && (!metodo||i.metodo===metodo);
  });

  const cobrado = todos.filter(i=>i.estado==='Pagado').reduce((s,i)=>s+(i.monto||0),0);
  const pendiente = todos.filter(i=>i.estado==='Pendiente').reduce((s,i)=>s+(i.monto||0),0);
  const esteMes = todos.filter(i=>{ const d=new Date(i.fecha+'T00:00:00'); return i.estado==='Pagado'&&d.getMonth()===m&&d.getFullYear()===y; }).reduce((s,i)=>s+(i.monto||0),0);

  document.getElementById('kTotal').textContent    = Fmt.currencyShort(cobrado);
  document.getElementById('kEsteMes').textContent  = Fmt.currencyShort(esteMes);
  document.getElementById('kPendientes').textContent = Fmt.currencyShort(pendiente);
  document.getElementById('kNPagos').textContent   = todos.length;
  document.getElementById('paginacionInfo').textContent = `Mostrando ${filtrados.length} de ${todos.length} pagos`;

  tbody.innerHTML = '';
  if (!filtrados.length) { tbody.innerHTML = emptyState('No se encontraron pagos.'); return; }

  filtrados.sort((a,b) => new Date(b.fecha||0)-new Date(a.fecha||0)).forEach(ing => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong class="i-codigo"></strong></td>
      <td class="i-reserva"></td>
      <td><div class="client-cell">${avatarEl(Data.clienteNombre(ing.clienteId), ing.clienteId)}<span class="i-cliente"></span></div></td>
      <td class="i-concepto" style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></td>
      <td>${Fmt.dateShort(ing.fecha)}</td>
      <td><strong style="color:var(--green)">${Fmt.currency(ing.monto)}</strong></td>
      <td>${badge(ing.estado)}</td>
      <td><span class="badge badge--gray"></span></td>
      <td>
        <div class="actions">
          <button class="action-btn" title="Editar" onclick="editarPago(${ing.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
          </button>
          <button class="action-btn delete" title="Eliminar" onclick="pedirEliminar(${ing.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
          </button>
        </div>
      </td>`;
    tr.querySelector('.i-codigo').textContent  = ing.codigo||'—';
    tr.querySelector('.i-reserva').textContent = Data.reservaCodigo(ing.reservaId);
    tr.querySelector('.i-cliente').textContent = Data.clienteNombre(ing.clienteId);
    tr.querySelector('.i-concepto').textContent= ing.concepto||'—';
    tr.querySelector('.badge--gray').textContent = ing.metodo||'—';
    tbody.appendChild(tr);
  });
}

function abrirModal() {
  editandoId = null;
  document.getElementById('modalTitulo').textContent = 'Registrar Pago';
  limpiarForm();
  poblarSelects();
  document.getElementById('fFecha').value = new Date().toISOString().split('T')[0];
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
}
function cerrarModal() { document.getElementById('modalOverlay').classList.remove('modal-overlay--open'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id==='modalOverlay') cerrarModal(); });

function limpiarForm() {
  ['fConcepto','fMonto','fFecha'].forEach(id => document.getElementById(id).value='');
  document.getElementById('fMetodo').selectedIndex=0;
  document.getElementById('fEstado').selectedIndex=0;
}

function guardarPago() {
  const clienteId = parseInt(document.getElementById('fCliente').value)||null;
  const reservaId = parseInt(document.getElementById('fReserva').value)||null;
  const concepto  = document.getElementById('fConcepto').value.trim();
  const monto     = parseFloat(document.getElementById('fMonto').value)||0;
  const fecha     = document.getElementById('fFecha').value;
  const metodo    = document.getElementById('fMetodo').value;
  const estado    = document.getElementById('fEstado').value;

  if (!clienteId)  { Toast.error('Selecciona un cliente'); return; }
  if (monto <= 0)  { Toast.error('El monto debe ser mayor a 0'); return; }
  if (!fecha)      { Toast.error('La fecha es obligatoria'); return; }

  // Verificar que el pago no exceda el saldo pendiente de la reserva
  if (reservaId && estado === 'Pagado') {
    const reserva = Data.reservas.find(reservaId);
    if (reserva) {
      const yaPagado = Data.ingresos.getAll()
        .filter(i => i.reservaId === reservaId && i.estado === 'Pagado' && i.id !== editandoId)
        .reduce((s, i) => s + (i.monto || 0), 0);
      if (yaPagado + monto > reserva.total) {
        const exceso = Fmt.currency(yaPagado + monto - reserva.total);
        Toast.error(`El monto excede el total de la reserva en ${exceso}`);
        return;
      }
    }
  }

  if (editandoId !== null) {
    const ingAnterior = Data.ingresos.find(editandoId);
    Data.ingresos.update(editandoId, { clienteId, reservaId, concepto, monto, fecha, metodo, estado });
    // Sincronizar reserva anterior y nueva si cambió
    if (ingAnterior?.reservaId) Data.sincronizarSaldoReserva(ingAnterior.reservaId);
    if (reservaId && reservaId !== ingAnterior?.reservaId) Data.sincronizarSaldoReserva(reservaId);
    Toast.success('Pago actualizado ✓');
  } else {
    Data.ingresos.create({ codigo: nextCodigo(), clienteId, reservaId, concepto, monto, fecha, metodo, estado });
    if (reservaId) Data.sincronizarSaldoReserva(reservaId);
    Toast.success('Pago registrado ✓');
  }
  cerrarModal();
  renderTabla();
}

function editarPago(id) {
  const ing = Data.ingresos.find(id);
  if (!ing) return;
  editandoId = id;
  poblarSelects();
  document.getElementById('modalTitulo').textContent = 'Editar Pago';
  document.getElementById('fCliente').value  = ing.clienteId||'';
  document.getElementById('fReserva').value  = ing.reservaId||'';
  document.getElementById('fConcepto').value = ing.concepto||'';
  document.getElementById('fMonto').value    = ing.monto||'';
  document.getElementById('fFecha').value    = ing.fecha||'';
  document.getElementById('fMetodo').value   = ing.metodo;
  document.getElementById('fEstado').value   = ing.estado;
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
}

async function pedirEliminar(id) {
  const ok = await Confirm({ title:'¿Eliminar pago?', message:'Esta acción no se puede deshacer.', okText:'Sí, eliminar' });
  if (!ok) return;
  const ing = Data.ingresos.find(id);
  Data.ingresos.delete(id);
  if (ing?.reservaId) Data.sincronizarSaldoReserva(ing.reservaId);
  renderTabla();
  Toast.success('Pago eliminado');
}

function exportarCSV() {
  const rows = [['Código','Reserva','Cliente','Concepto','Fecha','Monto','Estado','Método']];
  Data.ingresos.getAll().forEach(i => rows.push([i.codigo||'',Data.reservaCodigo(i.reservaId),`"${Data.clienteNombre(i.clienteId)}"`,`"${i.concepto||''}"`,i.fecha,i.monto||0,i.estado,i.metodo||'']));
  const csv = rows.map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('﻿'+csv);
  a.download = 'ingresos.csv'; a.click();
  Toast.success('CSV exportado ✓');
}

renderTabla();
</script>
</body>
</html>
