<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory – Gastos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="js/theme.js"></script>
  <script src="js/logo.js"></script>
</head>
<body>
<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <main class="main" id="main">
    <div class="page-wrapper">

      <div class="page-header">
        <div><h1>Gastos</h1><p>Controla gastos operativos asociados a eventos y proveedores.</p></div>
        <div class="page-actions">
          <button class="btn btn--outline" onclick="exportarCSV()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            Exportar
          </button>
          <button class="btn btn--primary" onclick="abrirModal()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
            Nuevo Gasto
          </button>
        </div>
      </div>

      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--red"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.077 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.511-1.31c-.563-.649-1.413-1.077-2.354-1.253V5z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kTotal">—</div><div class="kpi-label">Total Gastos</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--orange"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kMes">—</div><div class="kpi-label">Este Mes</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--green"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kPagados">—</div><div class="kpi-label">Pagados</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--yellow"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kPendientes">—</div><div class="kpi-label">Pendientes</div></div>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar gasto…" oninput="renderTabla()"/>
        </div>
        <select class="filter-select" id="filtroCategoria" onchange="renderTabla()">
          <option value="">Todas las categorías</option>
        </select>
        <select class="filter-select" id="filtroEstado" onchange="renderTabla()">
          <option value="">Todos los estados</option>
          <option>Pagado</option><option>Pendiente</option><option>Anulado</option>
        </select>
        <select class="filter-select" id="filtroMetodo" onchange="renderTabla()">
          <option value="">Todos los métodos</option>
          <option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Yape/Plin</option>
        </select>
      </div>

      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr><th>Fecha</th><th>Evento</th><th>Proveedor</th><th>Categoría</th><th>Descripción</th><th>Monto</th><th>Estado</th><th>Método</th><th>Adjunto</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
        <div class="tbl-pagination">
          <span id="paginacionInfo">—</span>
          <div class="pag-btns"><button class="pag-btn active">1</button></div>
        </div>
      </div>

    </div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal modal--lg">
    <div class="modal-header">
      <h3 id="modalTitulo">Nuevo Gasto</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Evento *</label><select class="form-select" id="fEvento" onchange="onEventoChange()"></select></div>
      <div class="form-group"><label>Proveedor relacionado</label><select class="form-select" id="fEventoProveedor"></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Categoría</label><select class="form-select" id="fCategoria"></select></div>
      <div class="form-group"><label>Monto (S/) *</label><input type="number" class="form-input" id="fMonto" placeholder="0.00" min="0" step="0.01"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Fecha *</label><input type="date" class="form-input" id="fFecha"/></div>
      <div class="form-group"><label>Método de pago</label><select class="form-select" id="fMetodo"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Yape/Plin</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Estado</label><select class="form-select" id="fEstado"><option>Pagado</option><option>Pendiente</option><option>Anulado</option></select></div>
      <div class="form-group"><label>Adjunto / comprobante</label><input type="url" class="form-input" id="fComprobante" placeholder="https://..."/></div>
    </div>
    <div class="form-group"><label>Descripción</label><textarea class="form-input form-textarea" id="fDescripcion" rows="3" placeholder="Detalle del gasto…"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn--outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn--primary" onclick="guardarGasto()">Guardar Gasto</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import * as gastosService from './js/services/gastosService.js';
import * as eventosService from './js/services/eventosService.js';

const CATEGORIAS = ['Catering','Decoración','Fotografía/Filmación','Música/Sonido','Transporte','Mobiliario','Viáticos','Papelería','Caja chica','Combustible','Otros'];

let editandoId = null;
let todosLosGastos = [];
let eventosDisponibles = [];
let proveedoresEvento = [];

window.renderTabla = renderTabla;
window.exportarCSV = exportarCSV;
window.abrirModal = abrirModal;
window.cerrarModal = cerrarModal;
window.guardarGasto = guardarGasto;
window.editarGasto = editarGasto;
window.pedirEliminar = pedirEliminar;
window.onEventoChange = onEventoChange;

function poblarCategorias() {
  const filtro = document.getElementById('filtroCategoria');
  const campo = document.getElementById('fCategoria');
  filtro.innerHTML = '<option value="">Todas las categorías</option>';
  campo.innerHTML = '';
  CATEGORIAS.forEach(c => {
    const of = document.createElement('option'); of.value = c; of.textContent = c; filtro.appendChild(of);
    const oc = document.createElement('option'); oc.value = c; oc.textContent = c; campo.appendChild(oc);
  });
}

function poblarEventos() {
  const sel = document.getElementById('fEvento');
  sel.innerHTML = '<option value="">— Seleccionar evento —</option>';
  eventosDisponibles.forEach(e => {
    const o = document.createElement('option');
    o.value = e.id;
    o.textContent = `${e.nombre} · ${Fmt.dateShort(e.fecha)}`;
    sel.appendChild(o);
  });
}

function poblarProveedoresEvento(lista = []) {
  const sel = document.getElementById('fEventoProveedor');
  sel.innerHTML = '<option value="">— Sin proveedor específico —</option>';
  lista.forEach(ep => {
    const o = document.createElement('option');
    o.value = ep.id;
    o.textContent = `${ep.proveedor?.nombre || 'Proveedor'}${ep.servicio_contratado ? ' · ' + ep.servicio_contratado : ''}`;
    sel.appendChild(o);
  });
}

async function onEventoChange() {
  const eventoId = parseInt(document.getElementById('fEvento').value) || null;
  const { data, error } = await gastosService.getEventoProveedores(eventoId);
  if (error) { Toast.error('Error al cargar proveedores del evento'); return; }
  proveedoresEvento = data || [];
  poblarProveedoresEvento(proveedoresEvento);
}

function renderTabla() {
  const txt = (document.getElementById('searchInput').value || '').toLowerCase();
  const categoria = document.getElementById('filtroCategoria').value;
  const estado = document.getElementById('filtroEstado').value;
  const metodo = document.getElementById('filtroMetodo').value;
  const tbody = document.getElementById('tablaBody');
  const ahora = new Date();

  const filtrados = todosLosGastos.filter(g => {
    const proveedor = g.evento_proveedor?.proveedor?.nombre || '';
    const texto = `${g.evento?.nombre || ''} ${proveedor} ${g.categoria || ''} ${g.descripcion || ''}`.toLowerCase();
    return texto.includes(txt)
      && (!categoria || g.categoria === categoria)
      && (!estado || g.estado === estado)
      && (!metodo || g.metodo === metodo);
  });

  const total = todosLosGastos.filter(g => g.estado !== 'Anulado').reduce((s, g) => s + Number(g.monto || 0), 0);
  const esteMes = todosLosGastos.filter(g => {
    const d = new Date(`${g.fecha}T00:00:00`);
    return g.estado !== 'Anulado' && d.getMonth() === ahora.getMonth() && d.getFullYear() === ahora.getFullYear();
  }).reduce((s, g) => s + Number(g.monto || 0), 0);

  document.getElementById('kTotal').textContent = Fmt.currencyShort(total);
  document.getElementById('kMes').textContent = Fmt.currencyShort(esteMes);
  document.getElementById('kPagados').textContent = todosLosGastos.filter(g => g.estado === 'Pagado').length;
  document.getElementById('kPendientes').textContent = todosLosGastos.filter(g => g.estado === 'Pendiente').length;
  document.getElementById('paginacionInfo').textContent = `Mostrando ${filtrados.length} de ${todosLosGastos.length} gastos`;

  tbody.innerHTML = '';
  if (!filtrados.length) { tbody.innerHTML = emptyState('No se encontraron gastos.'); return; }

  filtrados.forEach(g => {
    const proveedor = g.evento_proveedor?.proveedor?.nombre || '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${Fmt.dateShort(g.fecha)}</td>
      <td class="g-evento"></td>
      <td class="g-proveedor"></td>
      <td>${badge(g.categoria)}</td>
      <td class="g-desc" style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></td>
      <td><strong style="color:var(--red)">${Fmt.currency(g.monto)}</strong></td>
      <td>${badge(g.estado)}</td>
      <td><span class="badge badge--gray"></span></td>
      <td class="g-adjunto"></td>
      <td>
        <div class="actions">
          <button class="action-btn" title="Editar" onclick="editarGasto(${g.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
          </button>
          <button class="action-btn delete" title="Eliminar" onclick="pedirEliminar(${g.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
          </button>
        </div>
      </td>`;
    tr.querySelector('.g-evento').textContent = g.evento?.nombre || '—';
    tr.querySelector('.g-proveedor').textContent = proveedor;
    tr.querySelector('.g-desc').textContent = g.descripcion || '—';
    tr.querySelector('.badge--gray').textContent = g.metodo || '—';
    tr.querySelector('.g-adjunto').innerHTML = g.comprobante_url
      ? `<a class="link-sm" href="${escHtml(g.comprobante_url)}" target="_blank" rel="noopener">Ver</a>`
      : '—';
    tbody.appendChild(tr);
  });
}

function abrirModal() {
  editandoId = null;
  document.getElementById('modalTitulo').textContent = 'Nuevo Gasto';
  limpiarForm();
  poblarEventos();
  poblarProveedoresEvento([]);
  document.getElementById('fFecha').value = new Date().toISOString().split('T')[0];
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
}

function cerrarModal() { document.getElementById('modalOverlay').classList.remove('modal-overlay--open'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') cerrarModal(); });

function limpiarForm() {
  ['fMonto','fFecha','fComprobante','fDescripcion'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fEvento').value = '';
  document.getElementById('fCategoria').value = 'Otros';
  document.getElementById('fMetodo').value = 'Efectivo';
  document.getElementById('fEstado').value = 'Pagado';
}

async function guardarGasto() {
  const evento_id = parseInt(document.getElementById('fEvento').value) || null;
  const evento_proveedor_id = parseInt(document.getElementById('fEventoProveedor').value) || null;
  const categoria = document.getElementById('fCategoria').value;
  const monto = parseFloat(document.getElementById('fMonto').value) || 0;
  const fecha = document.getElementById('fFecha').value;
  const metodo = document.getElementById('fMetodo').value;
  const estado = document.getElementById('fEstado').value;
  const comprobante_url = document.getElementById('fComprobante').value.trim();
  const descripcion = document.getElementById('fDescripcion').value.trim();

  if (!evento_id) { Toast.error('Selecciona un evento'); return; }
  if (monto <= 0) { Toast.error('El monto debe ser mayor a 0'); return; }
  if (!fecha) { Toast.error('La fecha es obligatoria'); return; }
  if (comprobante_url && !/^https?:\/\/.+/i.test(comprobante_url)) { Toast.error('El adjunto debe ser una URL válida'); return; }

  const payload = { evento_id, evento_proveedor_id, categoria, monto, fecha, metodo, estado, comprobante_url, descripcion };
  const res = editandoId !== null
    ? await gastosService.actualizar(editandoId, payload)
    : await gastosService.crear(payload);

  if (res.error) { Toast.error('Error al guardar gasto: ' + res.error); return; }
  Toast.success(editandoId ? 'Gasto actualizado ✓' : 'Gasto registrado ✓');
  cerrarModal();
  await cargarDatos();
}

async function editarGasto(id) {
  const { data: g, error } = await gastosService.getById(id);
  if (error) { Toast.error('Error al cargar gasto'); return; }
  if (!g) return;
  editandoId = id;
  poblarEventos();
  document.getElementById('modalTitulo').textContent = 'Editar Gasto';
  document.getElementById('fEvento').value = g.evento_id || '';
  await onEventoChange();
  document.getElementById('fEventoProveedor').value = g.evento_proveedor_id || '';
  document.getElementById('fCategoria').value = g.categoria || 'Otros';
  document.getElementById('fMonto').value = g.monto || '';
  document.getElementById('fFecha').value = g.fecha || '';
  document.getElementById('fMetodo').value = g.metodo || 'Efectivo';
  document.getElementById('fEstado').value = g.estado || 'Pagado';
  document.getElementById('fComprobante').value = g.comprobante_url || '';
  document.getElementById('fDescripcion').value = g.descripcion || '';
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
}

async function pedirEliminar(id) {
  const ok = await Confirm({ title:'¿Eliminar gasto?', message:'Esta acción no se puede deshacer.', okText:'Sí, eliminar' });
  if (!ok) return;
  const res = await gastosService.eliminar(id);
  if (res.error) { Toast.error('No se pudo eliminar. Verifica permisos.'); return; }
  Toast.success('Gasto eliminado');
  await cargarDatos();
}

function exportarCSV() {
  const rows = [['Fecha','Evento','Proveedor','Categoría','Descripción','Monto','Estado','Método','Adjunto']];
  todosLosGastos.forEach(g => rows.push([
    g.fecha,
    g.evento?.nombre || '',
    g.evento_proveedor?.proveedor?.nombre || '',
    g.categoria,
    g.descripcion || '',
    g.monto || 0,
    g.estado,
    g.metodo,
    g.comprobante_url || '',
  ]));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Gastos');
  XLSX.writeFile(wb, 'gastos.xlsx');
  Toast.success('Excel exportado ✓');
}

async function cargarDatos() {
  poblarCategorias();
  const [resGastos, resEventos] = await Promise.all([
    gastosService.getAll(),
    eventosService.getAll(),
  ]);
  if (resGastos.error) { Toast.error('Error al cargar gastos'); return; }
  if (resEventos.error) { Toast.error('Error al cargar eventos'); return; }
  todosLosGastos = resGastos.data || [];
  eventosDisponibles = resEventos.data || [];
  renderTabla();
}

cargarDatos();
</script>
</body>
</html>
