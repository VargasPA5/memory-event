<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory – Decoraciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    .img-upload-row { display:flex; gap:14px; align-items:flex-start; }
    .img-upload-preview { width:88px; height:88px; border-radius:14px; overflow:hidden; background:var(--main-bg); border:1.5px dashed var(--card-border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .img-upload-preview img { width:100%; height:100%; object-fit:cover; }
    .img-upload-preview svg { width:28px; height:28px; color:var(--txt-muted); }
    .img-upload-actions { display:flex; flex-direction:column; gap:8px; padding-top:4px; }
    .img-upload-hint { font-size:11.5px; color:var(--txt-muted); }
    .img-upload-remove { background:none; border:none; padding:0; font-size:12px; font-weight:600; color:var(--txt-muted); text-decoration:underline; cursor:pointer; text-align:left; }
    .img-upload-remove:hover { color:var(--red); }
    .img-upload-remove[hidden] { display:none; }

    .view-toggle { display:flex; border:1px solid var(--card-border); border-radius:10px; overflow:hidden; flex-shrink:0; }
    .view-toggle button { background:none; border:none; padding:0 12px; height:38px; cursor:pointer; color:var(--txt-secondary); display:flex; align-items:center; }
    .view-toggle button svg { width:17px; height:17px; }
    .view-toggle button.active { background:var(--accent-light); color:var(--accent-hover); }

    .catalog-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px; }
    .catalog-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-lg); overflow:hidden; display:flex; flex-direction:column; }
    .catalog-card-img { width:100%; aspect-ratio:4/3; background:var(--main-bg); display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .catalog-card-img img { width:100%; height:100%; object-fit:cover; }
    .catalog-card-img svg { width:34px; height:34px; color:var(--txt-muted); }
    .catalog-card-body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
    .catalog-card-name { font-weight:700; font-size:14.5px; color:var(--txt-primary); }
    .catalog-card-desc { font-size:12.5px; color:var(--txt-secondary); line-height:1.4; flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .catalog-card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
    .catalog-card-price { font-weight:700; color:var(--txt-primary); font-size:13.5px; }
  </style>
  <script src="js/theme.js"></script>
  <script src="js/logo.js"></script>
</head>
<body class="app-page app-page--decoraciones">
<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <main class="main" id="main">
    <div class="page-wrapper">

      <div class="page-header">
        <div><h1>Decoraciones</h1><p>Administra el catálogo de decoración disponible para eventos.</p></div>
        <div class="page-actions">
          <button class="btn btn--outline" onclick="exportarCSV()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            Exportar
          </button>
          <button class="btn btn--primary" onclick="abrirModal()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
            Nueva Decoración
          </button>
        </div>
      </div>

      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--purple"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a3 3 0 00-3 3v8a3 3 0 003 3h10a3 3 0 003-3V6a3 3 0 00-3-3H5zm1 3a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm0 4a1 1 0 011-1h2a1 1 0 010 2H7a1 1 0 01-1-1z"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kTotal">—</div><div class="kpi-label">Total Decoraciones</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--green"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kActivas">—</div><div class="kpi-label">Activas</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--red"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kInactivas">—</div><div class="kpi-label">Inactivas</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--orange"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V4zM12 4a2 2 0 012-2h.01A2 2 0 0116 4v.01A2 2 0 0114 6h-.01A2 2 0 0112 4.01V4zM4 12a2 2 0 012-2h.01A2 2 0 018 12v.01A2 2 0 016.01 14H6a2 2 0 01-2-1.99V12zM12 10a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kTipos">—</div><div class="kpi-label">Tipos</div></div>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar decoración…" oninput="renderTabla()"/>
        </div>
        <select class="filter-select" id="filtroTipo" onchange="renderTabla()">
          <option value="">Todos los tipos</option>
        </select>
        <select class="filter-select" id="filtroEstado" onchange="renderTabla()">
          <option value="">Todos los estados</option>
          <option>Activo</option><option>Inactivo</option>
        </select>
        <div class="view-toggle" id="viewToggle">
          <button type="button" title="Vista de tabla" data-vista="tabla" onclick="cambiarVista('tabla')">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
          </button>
          <button type="button" title="Vista de catálogo" data-vista="catalogo" onclick="cambiarVista('catalogo')">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          </button>
        </div>
      </div>

      <div class="tbl-wrap" id="vistaTabla">
        <table class="tbl">
          <thead>
            <tr><th>Decoración</th><th>Tipo</th><th>Descripción</th><th>Costo ref.</th><th>Estado</th><th>Actualizado</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
        <div class="tbl-pagination">
          <span id="paginacionInfo">—</span>
          <div class="pag-btns"><button class="pag-btn active">1</button></div>
        </div>
      </div>

      <div class="catalog-grid" id="vistaCatalogo" style="display:none"></div>

    </div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitulo">Nueva Decoración</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Nombre *</label><input type="text" class="form-input" id="fNombre" placeholder="Nombre de la decoración"/></div>
      <div class="form-group"><label>Tipo</label><input type="text" class="form-input" id="fTipo" list="tiposSugeridos" placeholder="Ej: Floral"/></div>
    </div>
    <datalist id="tiposSugeridos"></datalist>
    <div class="form-row">
      <div class="form-group"><label>Costo referencial (S/)</label><input type="number" class="form-input" id="fCosto" placeholder="0.00" min="0" step="0.01"/></div>
      <div class="form-group"><label>Estado</label><select class="form-select" id="fEstado"><option>Activo</option><option>Inactivo</option></select></div>
    </div>
    <div class="form-group"><label>Descripción</label><textarea class="form-input form-textarea" id="fDescripcion" rows="3" placeholder="Materiales, colores, estilo o notas internas…"></textarea></div>
    <div class="form-group">
      <label>Imagen de la decoración</label>
      <div class="img-upload-row">
        <div class="img-upload-preview" id="imgPreview">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"/></svg>
        </div>
        <div class="img-upload-actions">
          <label class="btn btn--outline btn--sm" style="cursor:pointer">
            Elegir imagen
            <input type="file" id="fImagen" accept="image/jpeg,image/png,image/webp" style="display:none"/>
          </label>
          <button type="button" class="img-upload-remove" id="btnQuitarImagen" hidden onclick="quitarImagenSeleccionada()">Quitar imagen</button>
          <span class="img-upload-hint">JPG, PNG o WebP · máx. 5MB</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn--outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn--primary" onclick="guardarDecoracion()">Guardar Decoración</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import * as decoracionesService from './js/services/decoracionesService.js';

const TIPOS_BASE = ['Floral','Mesa','Iluminación','Temática','Escenario','Globos','Centro de mesa','Otros'];
const PLACEHOLDER_IMG_SVG = '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"/></svg>';

let editandoId = null;
let todasLasDecoraciones = [];
let vistaActual = 'tabla';

// Estado de la imagen dentro del modal: el archivo se sube recién al
// guardar (ver guardarDecoracion), no apenas se elige.
let archivoImagenSeleccionado = null;
let quitarImagenAlGuardar = false;
let imagenUrlActual = null;
let imagenPathActual = null;

window.renderTabla = renderTabla;
window.exportarCSV = exportarCSV;
window.abrirModal = abrirModal;
window.cerrarModal = cerrarModal;
window.guardarDecoracion = guardarDecoracion;
window.editarDecoracion = editarDecoracion;
window.cambiarEstadoDecoracion = cambiarEstadoDecoracion;
window.pedirEliminar = pedirEliminar;
window.cambiarVista = cambiarVista;
window.quitarImagenSeleccionada = quitarImagenSeleccionada;

function tiposDisponibles() {
  const existentes = todasLasDecoraciones.map(d => d.tipo).filter(Boolean);
  return Array.from(new Set([...TIPOS_BASE, ...existentes])).sort((a, b) => a.localeCompare(b, 'es'));
}

function poblarTipos() {
  const filtro = document.getElementById('filtroTipo');
  const sugeridos = document.getElementById('tiposSugeridos');
  filtro.innerHTML = '<option value="">Todos los tipos</option>';
  sugeridos.innerHTML = '';
  tiposDisponibles().forEach(tipo => {
    const of = document.createElement('option'); of.value = tipo; of.textContent = tipo; filtro.appendChild(of);
    const os = document.createElement('option'); os.value = tipo; sugeridos.appendChild(os);
  });
}

function renderTabla() {
  const txt = (document.getElementById('searchInput').value || '').toLowerCase();
  const tipo = document.getElementById('filtroTipo').value;
  const estado = document.getElementById('filtroEstado').value;
  const tbody = document.getElementById('tablaBody');

  const filtradas = todasLasDecoraciones.filter(d => {
    const texto = `${d.nombre || ''} ${d.tipo || ''} ${d.descripcion || ''}`.toLowerCase();
    return texto.includes(txt)
      && (!tipo || d.tipo === tipo)
      && (!estado || d.estado === estado);
  });

  document.getElementById('kTotal').textContent = todasLasDecoraciones.length;
  document.getElementById('kActivas').textContent = todasLasDecoraciones.filter(d => d.estado === 'Activo').length;
  document.getElementById('kInactivas').textContent = todasLasDecoraciones.filter(d => d.estado === 'Inactivo').length;
  document.getElementById('kTipos').textContent = new Set(todasLasDecoraciones.map(d => d.tipo).filter(Boolean)).size;
  document.getElementById('paginacionInfo').textContent = `Mostrando ${filtradas.length} de ${todasLasDecoraciones.length} decoraciones`;

  tbody.innerHTML = '';
  if (!filtradas.length) { tbody.innerHTML = emptyState('No se encontraron decoraciones.'); return; }

  filtradas.forEach(d => {
    const nuevoEstado = d.estado === 'Activo' ? 'Inactivo' : 'Activo';
    const tr = document.createElement('tr');
    const miniatura = d.imagen_url
      ? `<img src="${d.imagen_url}" alt="" class="avatar-img" style="width:32px;height:32px;border-radius:8px;object-fit:cover;flex-shrink:0"/>`
      : avatarEl(d.nombre, d.id);
    tr.innerHTML = `
      <td><div class="client-cell">${miniatura}<strong class="d-nombre"></strong></div></td>
      <td><span class="badge badge--purple d-tipo"></span></td>
      <td class="d-desc" style="max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></td>
      <td><strong>${Fmt.currency(d.costo_referencial)}</strong></td>
      <td>${badge(d.estado)}</td>
      <td>${Fmt.date(d.updated_at || d.created_at)}</td>
      <td>
        <div class="actions">
          <button class="action-btn" title="Editar" onclick="editarDecoracion(${d.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
          </button>
          <button class="action-btn" title="${nuevoEstado === 'Activo' ? 'Activar' : 'Desactivar'}" onclick="cambiarEstadoDecoracion(${d.id}, '${nuevoEstado}')">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
          </button>
          <button class="action-btn delete" title="Eliminar" onclick="pedirEliminar(${d.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
          </button>
        </div>
      </td>`;
    tr.querySelector('.d-nombre').textContent = d.nombre;
    tr.querySelector('.d-tipo').textContent = d.tipo || '—';
    tr.querySelector('.d-desc').textContent = d.descripcion || '—';
    tbody.appendChild(tr);
  });

  renderCatalogo(filtradas);
}

/* ── Vista de catálogo (tarjetas tipo tienda, para elegir decoraciones al
   armar un evento) — usa el mismo arreglo ya filtrado por renderTabla. ──── */
function renderCatalogo(filtradas) {
  const grid = document.getElementById('vistaCatalogo');
  // emptyState() arma un <tr><td>, pensado para <tbody>; acá el contenedor
  // es un <div class="catalog-grid">, por eso no se reutiliza tal cual.
  if (!filtradas.length) { grid.innerHTML = `<div class="empty-state">No se encontraron decoraciones.</div>`; return; }

  grid.innerHTML = filtradas.map(d => `
    <div class="catalog-card">
      <div class="catalog-card-img">
        ${d.imagen_url ? `<img src="${d.imagen_url}" alt="${escHtml(d.nombre)}"/>` : PLACEHOLDER_IMG_SVG}
      </div>
      <div class="catalog-card-body">
        <span class="catalog-card-name">${escHtml(d.nombre)}</span>
        <span class="catalog-card-desc">${escHtml(d.descripcion || 'Sin descripción')}</span>
        <div class="catalog-card-footer">
          <span class="catalog-card-price">${Fmt.currency(d.costo_referencial)}</span>
          ${badge(d.estado)}
        </div>
      </div>
    </div>`).join('');
}

function cambiarVista(vista) {
  vistaActual = vista;
  document.getElementById('vistaTabla').style.display = vista === 'tabla' ? '' : 'none';
  document.getElementById('vistaCatalogo').style.display = vista === 'catalogo' ? '' : 'none';
  document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b.dataset.vista === vista));
}

function abrirModal() {
  editandoId = null;
  document.getElementById('modalTitulo').textContent = 'Nueva Decoración';
  limpiarForm();
  poblarTipos();
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
  setTimeout(() => document.getElementById('fNombre').focus(), 50);
}

function cerrarModal() { document.getElementById('modalOverlay').classList.remove('modal-overlay--open'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') cerrarModal(); });

/* ── Imagen dentro del modal ───────────────────────────────────────────── */
function renderImgPreview(url) {
  const el = document.getElementById('imgPreview');
  el.innerHTML = url ? `<img src="${url}" alt=""/>` : PLACEHOLDER_IMG_SVG;
  document.getElementById('btnQuitarImagen').hidden = !url;
}

document.getElementById('fImagen').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const permitidos = ['image/jpeg','image/png','image/webp'];
  if (!permitidos.includes(file.type)) { Toast.error('Solo se permiten imágenes JPG, PNG o WebP'); e.target.value = ''; return; }
  if (file.size > 5 * 1024 * 1024) { Toast.error('La imagen no debe superar 5MB'); e.target.value = ''; return; }

  archivoImagenSeleccionado = file;
  quitarImagenAlGuardar = false;
  renderImgPreview(URL.createObjectURL(file));
});

function quitarImagenSeleccionada() {
  archivoImagenSeleccionado = null;
  quitarImagenAlGuardar = true;
  document.getElementById('fImagen').value = '';
  renderImgPreview(null);
}

function limpiarForm() {
  ['fNombre','fTipo','fCosto','fDescripcion'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fEstado').value = 'Activo';
  document.getElementById('fImagen').value = '';
  archivoImagenSeleccionado = null;
  quitarImagenAlGuardar = false;
  imagenUrlActual = null;
  imagenPathActual = null;
  renderImgPreview(null);
}

async function guardarDecoracion() {
  const nombre = document.getElementById('fNombre').value.trim();
  const tipo = document.getElementById('fTipo').value.trim();
  const costo_referencial = document.getElementById('fCosto').value;
  const estado = document.getElementById('fEstado').value;
  const descripcion = document.getElementById('fDescripcion').value.trim();

  if (!nombre) { Toast.error('El nombre es obligatorio'); return; }
  if (costo_referencial !== '' && Number(costo_referencial) < 0) { Toast.error('El costo no puede ser negativo'); return; }

  const duplicada = todasLasDecoraciones.find(d => d.nombre.toLowerCase() === nombre.toLowerCase() && d.id !== editandoId);
  if (duplicada) { Toast.error('Ya existe una decoración con ese nombre'); return; }

  const payload = { nombre, tipo, costo_referencial, estado, descripcion };
  const res = editandoId !== null
    ? await decoracionesService.actualizar(editandoId, payload)
    : await decoracionesService.crear(payload);

  if (res.error) { Toast.error('Error al guardar decoración: ' + res.error); return; }

  // La imagen se sube después de tener un id real (crear() recién lo asigna
  // acá), o se quita si el usuario presionó "Quitar imagen" al editar.
  const id = res.data.id;
  if (archivoImagenSeleccionado) {
    const imgRes = await decoracionesService.subirImagen(id, archivoImagenSeleccionado, imagenPathActual);
    if (imgRes.error) Toast.warning('La decoración se guardó, pero la imagen no se pudo subir: ' + imgRes.error);
  } else if (quitarImagenAlGuardar && imagenPathActual) {
    await decoracionesService.eliminarImagen(id, imagenPathActual);
  }

  Toast.success(editandoId ? 'Decoración actualizada ✓' : 'Decoración guardada ✓');
  cerrarModal();
  await cargarDatos();
}

async function editarDecoracion(id) {
  const { data: d, error } = await decoracionesService.getById(id);
  if (error) { Toast.error('Error al cargar decoración'); return; }
  if (!d) return;
  editandoId = id;
  poblarTipos();
  document.getElementById('modalTitulo').textContent = 'Editar Decoración';
  document.getElementById('fNombre').value = d.nombre || '';
  document.getElementById('fTipo').value = d.tipo || '';
  document.getElementById('fCosto').value = d.costo_referencial ?? '';
  document.getElementById('fEstado').value = d.estado || 'Activo';
  document.getElementById('fDescripcion').value = d.descripcion || '';
  archivoImagenSeleccionado = null;
  quitarImagenAlGuardar = false;
  imagenUrlActual = d.imagen_url || null;
  imagenPathActual = d.imagen_storage_path || null;
  document.getElementById('fImagen').value = '';
  renderImgPreview(imagenUrlActual);
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
}

async function cambiarEstadoDecoracion(id, estado) {
  const res = await decoracionesService.cambiarEstado(id, estado);
  if (res.error) { Toast.error('No se pudo cambiar el estado: ' + res.error); return; }
  Toast.success(estado === 'Activo' ? 'Decoración activada' : 'Decoración desactivada');
  await cargarDatos();
}

async function pedirEliminar(id) {
  const ok = await Confirm({ title:'¿Eliminar decoración?', message:'Si está asociada a eventos, la base de datos impedirá eliminarla.', okText:'Sí, eliminar' });
  if (!ok) return;
  const res = await decoracionesService.eliminar(id);
  if (res.error) { Toast.error('No se pudo eliminar. Verifica permisos o asociaciones con eventos.'); return; }
  Toast.success('Decoración eliminada');
  await cargarDatos();
}

function exportarCSV() {
  const rows = [['ID','Nombre','Tipo','Descripción','Costo referencial','Estado','Creado','Actualizado']];
  todasLasDecoraciones.forEach(d => rows.push([
    d.id,
    d.nombre,
    d.tipo || '',
    d.descripcion || '',
    d.costo_referencial ?? '',
    d.estado,
    d.created_at,
    d.updated_at,
  ]));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Decoraciones');
  XLSX.writeFile(wb, 'decoraciones.xlsx');
  Toast.success('Excel exportado ✓');
}

async function cargarDatos() {
  const { data, error } = await decoracionesService.getAll();
  if (error) { Toast.error('Error al cargar decoraciones'); return; }
  todasLasDecoraciones = data || [];
  poblarTipos();
  renderTabla();
}

cambiarVista('tabla');
cargarDatos();
</script>
</body>
