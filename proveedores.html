<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory – Proveedores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="js/theme.js"></script>
  <script src="js/logo.js"></script>
</head>
<body class="app-page app-page--proveedores">
<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <main class="main" id="main">
    <div class="page-wrapper">

      <div class="page-header">
        <div><h1>Proveedores</h1><p>Gestiona la información de tus proveedores de servicios.</p></div>
        <div class="page-actions">
          <button class="btn btn--outline" onclick="exportarCSV()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            Exportar
          </button>
          <button class="btn btn--primary" onclick="abrirModal()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
            Nuevo Proveedor
          </button>
        </div>
      </div>

      <!-- KPIs -->
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--blue"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M8 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM15 16.5a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z"/><path d="M3 4a1 1 0 00-1 1v10a1 1 0 001 1h1.05a2.5 2.5 0 014.9 0H10a1 1 0 001-1V5a1 1 0 00-1-1H3zM14 7a1 1 0 00-1 1v6.05A2.5 2.5 0 0115.95 16H17a1 1 0 001-1v-5a1 1 0 00-.293-.707l-2-2A1 1 0 0015 7h-1z"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kTotal">—</div><div class="kpi-label">Total Proveedores</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--green"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kActivos">—</div><div class="kpi-label">Activos</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--red"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kInactivos">—</div><div class="kpi-label">Inactivos</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--purple"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kTipos">—</div><div class="kpi-label">Tipos de Servicio</div></div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar proveedor…" oninput="renderTabla()"/>
        </div>
        <select class="filter-select" id="filtroTipo" onchange="renderTabla()">
          <option value="">Todos los tipos</option>
          <option>Decoración</option><option>Catering</option><option>Música</option><option>Fotografía</option><option>Coordinación</option><option>Otros</option>
        </select>
        <select class="filter-select" id="filtroEstado" onchange="renderTabla()">
          <option value="">Todos los estados</option>
          <option>Activo</option><option>Inactivo</option>
        </select>
      </div>

      <!-- Tabla -->
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr><th>Proveedor</th><th>Contacto</th><th>Teléfono</th><th>Email</th><th>Tipo</th><th>Estado</th><th>Registrado</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
        <div class="tbl-pagination">
          <span id="paginacionInfo">—</span>
          <div class="pag-btns"><button class="pag-btn active">1</button></div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitulo">Nuevo Proveedor</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Nombre *</label><input type="text" class="form-input" id="fNombre" placeholder="Nombre del proveedor"/></div>
      <div class="form-group"><label>Tipo de Servicio</label><select class="form-select" id="fTipo"><option>Decoración</option><option>Catering</option><option>Música</option><option>Fotografía</option><option>Coordinación</option><option>Otros</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Contacto</label><input type="text" class="form-input" id="fContacto" placeholder="Nombre del contacto"/></div>
      <div class="form-group"><label>Teléfono</label><input type="text" class="form-input" id="fTelefono" placeholder="987 000 000"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Email</label><input type="email" class="form-input" id="fEmail" placeholder="proveedor@email.com"/></div>
      <div class="form-group"><label>Estado</label><select class="form-select" id="fEstado"><option>Activo</option><option>Inactivo</option></select></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn--outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn--primary" onclick="guardarProveedor()">Guardar Proveedor</button>
    </div>
  </div>
</div>

<!-- Modal catálogo del proveedor -->
<div class="modal-overlay" id="catalogoOverlay">
  <div class="modal" style="max-width:980px">
    <div class="modal-header">
      <h3 id="catalogoTitulo">Catálogo del proveedor</h3>
      <button class="modal-close" onclick="cerrarCatalogo()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Buscar platos</label>
        <input type="text" class="form-input" id="buscarPlatosProveedor" placeholder="Filtrar platos ofrecidos" oninput="renderCatalogoProveedor()"/>
      </div>
      <div class="form-group">
        <label>Buscar decoraciones</label>
        <input type="text" class="form-input" id="buscarDecoracionesProveedor" placeholder="Filtrar decoraciones ofrecidas" oninput="renderCatalogoProveedor()"/>
      </div>
    </div>
    <div class="form-row" style="align-items:flex-start">
      <div class="form-group">
        <label>Platos que ofrece</label>
        <div class="tbl-wrap" style="max-height:360px;overflow:auto">
          <table class="tbl">
            <thead><tr><th>Activo</th><th>Plato</th><th>Precio</th><th>Notas</th></tr></thead>
            <tbody id="catPlatosBody"></tbody>
          </table>
        </div>
      </div>
      <div class="form-group">
        <label>Decoraciones que ofrece</label>
        <div class="tbl-wrap" style="max-height:360px;overflow:auto">
          <table class="tbl">
            <thead><tr><th>Activo</th><th>Decoración</th><th>Costo</th><th>Notas</th></tr></thead>
            <tbody id="catDecoracionesBody"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn--outline" onclick="cerrarCatalogo()">Cancelar</button>
      <button class="btn btn--primary" onclick="guardarCatalogoProveedor()">Guardar Catálogo</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { sessionReady } from './js/supabaseClient.js';
import * as proveedoresService from './js/services/proveedoresService.js';

let editandoId = null;
let todosLosProveedores = [];
let catalogoProveedorId = null;
let platosCatalogoOpciones = [];
let decoracionesCatalogoOpciones = [];
let proveedorPlatosActuales = [];
let proveedorDecoracionesActuales = [];

window.renderTabla = renderTabla;
window.renderCatalogoProveedor = renderCatalogoProveedor;
window.exportarCSV = exportarCSV;
window.abrirModal = abrirModal;
window.cerrarModal = cerrarModal;
window.abrirCatalogo = abrirCatalogo;
window.cerrarCatalogo = cerrarCatalogo;
window.guardarCatalogoProveedor = guardarCatalogoProveedor;
window.guardarProveedor = guardarProveedor;
window.editarProveedor = editarProveedor;
window.pedirEliminar = pedirEliminar;

async function cargarProveedores() {
  const { data, error } = await proveedoresService.getAll();
  if (error) { Toast.error('Error al cargar proveedores'); return; }
  todosLosProveedores = data || [];
  renderTabla();
}

function renderTabla() {
  const txt    = (document.getElementById('searchInput').value||'').toLowerCase();
  const tipo   = document.getElementById('filtroTipo').value;
  const estado = document.getElementById('filtroEstado').value;
  const tbody  = document.getElementById('tablaBody');

  const filtrados = todosLosProveedores.filter(p =>
    (p.nombre.toLowerCase().includes(txt) || (p.contacto||'').toLowerCase().includes(txt)) &&
    (!tipo   || p.tipo   === tipo) &&
    (!estado || p.estado === estado)
  );

  const tiposUnicos = new Set(todosLosProveedores.map(p=>p.tipo)).size;
  document.getElementById('kTotal').textContent    = todosLosProveedores.length;
  document.getElementById('kActivos').textContent  = todosLosProveedores.filter(p=>p.estado==='Activo').length;
  document.getElementById('kInactivos').textContent= todosLosProveedores.filter(p=>p.estado==='Inactivo').length;
  document.getElementById('kTipos').textContent    = tiposUnicos;
  document.getElementById('paginacionInfo').textContent = `Mostrando ${filtrados.length} de ${todosLosProveedores.length} proveedores`;

  tbody.innerHTML = '';
  if (!filtrados.length) { tbody.innerHTML = emptyState('No se encontraron proveedores.'); return; }

  filtrados.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><div class="client-cell">${avatarEl(p.nombre, p.id)}<strong class="p-nombre"></strong></div></td>
      <td class="p-contacto"></td>
      <td class="p-tel"></td>
      <td class="p-email"></td>
      <td>${badge(p.tipo)}</td>
      <td>${badge(p.estado)}</td>
      <td>${Fmt.date(p.created_at)}</td>
      <td>
        <div class="actions">
          ${Auth.isAdmin() ? `
          <button class="action-btn" title="Catálogo ofrecido" onclick="abrirCatalogo(${p.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V7.414A2 2 0 0017.414 6L15 3.586A2 2 0 0013.586 3H4zm1 4a1 1 0 011-1h5a1 1 0 110 2H6a1 1 0 01-1-1zm0 4a1 1 0 011-1h8a1 1 0 110 2H6a1 1 0 01-1-1zm0 4a1 1 0 011-1h8a1 1 0 110 2H6a1 1 0 01-1-1z"/></svg>
          </button>` : ''}
          <button class="action-btn" title="Editar" onclick="editarProveedor(${p.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
          </button>
          <button class="action-btn delete" title="Eliminar" onclick="pedirEliminar(${p.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
          </button>
        </div>
      </td>`;
    tr.querySelector('.p-nombre').textContent  = p.nombre;
    tr.querySelector('.p-contacto').textContent= p.contacto||'—';
    tr.querySelector('.p-tel').textContent     = p.telefono||'—';
    tr.querySelector('.p-email').textContent   = p.email||'—';
    tbody.appendChild(tr);
  });
}

function abrirModal() {
  editandoId = null;
  document.getElementById('modalTitulo').textContent = 'Nuevo Proveedor';
  limpiarForm();
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
  setTimeout(() => document.getElementById('fNombre').focus(), 50);
}
function cerrarModal() { document.getElementById('modalOverlay').classList.remove('modal-overlay--open'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id==='modalOverlay') cerrarModal(); });

function limpiarForm() {
  ['fNombre','fContacto','fTelefono','fEmail'].forEach(id => document.getElementById(id).value='');
  document.getElementById('fTipo').selectedIndex=0;
  document.getElementById('fEstado').selectedIndex=0;
}

async function guardarProveedor() {
  const nombre   = document.getElementById('fNombre').value.trim();
  const tipo     = document.getElementById('fTipo').value;
  const contacto = document.getElementById('fContacto').value.trim();
  const telefono = document.getElementById('fTelefono').value.trim();
  const email    = document.getElementById('fEmail').value.trim();
  const estado   = document.getElementById('fEstado').value;

  if (!nombre) { Toast.error('El nombre es obligatorio'); return; }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { Toast.error('El email del proveedor no es válido'); return; }

  const dupNombre = todosLosProveedores.find(p => p.nombre.toLowerCase() === nombre.toLowerCase() && p.id !== editandoId);
  if (dupNombre) { Toast.error('Ya existe un proveedor con ese nombre'); return; }

  const payload = { nombre, tipo, contacto, telefono, email, estado };

  let res;
  if (editandoId !== null) {
    res = await proveedoresService.actualizar(editandoId, payload);
  } else {
    res = await proveedoresService.crear(payload);
  }

  if (res.error) { Toast.error('Error al guardar: ' + res.error); return; }

  Toast.success(editandoId ? 'Proveedor actualizado ✓' : 'Proveedor guardado ✓');
  cerrarModal();
  await cargarProveedores();
}

function editarProveedor(id) {
  const p = todosLosProveedores.find(x => x.id === id);
  if (!p) return;
  editandoId = id;
  document.getElementById('modalTitulo').textContent = 'Editar Proveedor';
  document.getElementById('fNombre').value   = p.nombre;
  document.getElementById('fTipo').value     = p.tipo;
  document.getElementById('fContacto').value = p.contacto||'';
  document.getElementById('fTelefono').value = p.telefono||'';
  document.getElementById('fEmail').value    = p.email||'';
  document.getElementById('fEstado').value   = p.estado;
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
}

async function pedirEliminar(id) {
  const ok = await Confirm({ title:'¿Eliminar proveedor?', message:'Esta acción no se puede deshacer.', okText:'Sí, eliminar' });
  if (!ok) return;
  
  const res = await proveedoresService.eliminar(id);
  if (res.error) { Toast.error('Error al eliminar (¿Dependencias?)'); return; }
  
  Toast.success('Proveedor eliminado');
  await cargarProveedores();
}

function cerrarCatalogo() {
  document.getElementById('catalogoOverlay').classList.remove('modal-overlay--open');
  catalogoProveedorId = null;
}

document.getElementById('catalogoOverlay').addEventListener('click', e => {
  if (e.target.id === 'catalogoOverlay') cerrarCatalogo();
});

async function abrirCatalogo(id) {
  if (!Auth.isAdmin()) {
    Toast.warning('Solo el Administrador puede administrar catálogos de proveedores');
    return;
  }

  const proveedor = todosLosProveedores.find(p => p.id === id);
  if (!proveedor) return;
  catalogoProveedorId = id;
  document.getElementById('catalogoTitulo').textContent = `Catálogo de ${proveedor.nombre}`;
  document.getElementById('buscarPlatosProveedor').value = '';
  document.getElementById('buscarDecoracionesProveedor').value = '';
  document.getElementById('catPlatosBody').innerHTML = emptyState('Cargando platos...');
  document.getElementById('catDecoracionesBody').innerHTML = emptyState('Cargando decoraciones...');
  document.getElementById('catalogoOverlay').classList.add('modal-overlay--open');

  const [opcionesRes, actualesRes] = await Promise.all([
    proveedoresService.getCatalogoOpciones(),
    proveedoresService.getCatalogosProveedor(id),
  ]);

  if (opcionesRes.error || actualesRes.error) {
    Toast.error('No se pudo cargar el catálogo del proveedor');
    return;
  }

  platosCatalogoOpciones = opcionesRes.data?.platos || [];
  decoracionesCatalogoOpciones = opcionesRes.data?.decoraciones || [];
  proveedorPlatosActuales = actualesRes.data?.platos || [];
  proveedorDecoracionesActuales = actualesRes.data?.decoraciones || [];
  renderCatalogoProveedor();
}

function renderCatalogoProveedor() {
  const platosTxt = (document.getElementById('buscarPlatosProveedor').value || '').toLowerCase();
  const decorTxt = (document.getElementById('buscarDecoracionesProveedor').value || '').toLowerCase();
  const platosMap = new Map(proveedorPlatosActuales.map(p => [Number(p.plato_id), p]));
  const decorMap = new Map(proveedorDecoracionesActuales.map(d => [Number(d.decoracion_id), d]));

  const platos = platosCatalogoOpciones.filter(p =>
    `${p.nombre || ''} ${p.categoria || ''} ${p.descripcion || ''}`.toLowerCase().includes(platosTxt)
  );
  const decoraciones = decoracionesCatalogoOpciones.filter(d =>
    `${d.nombre || ''} ${d.tipo || ''} ${d.descripcion || ''}`.toLowerCase().includes(decorTxt)
  );

  document.getElementById('catPlatosBody').innerHTML = platos.length ? platos.map(p => {
    const actual = platosMap.get(Number(p.id));
    const precio = actual?.precio_referencial ?? p.precio_referencial ?? '';
    return `
      <tr data-plato-id="${p.id}">
        <td><input type="checkbox" class="cat-plato-activo" ${actual?.activo !== false && actual ? 'checked' : ''}/></td>
        <td><strong>${escHtml(p.nombre)}</strong><br><span style="color:var(--txt-muted);font-size:12px">${escHtml(p.categoria || '')}</span></td>
        <td><input class="form-input cat-plato-precio" type="number" min="0" step="0.01" value="${escHtml(String(precio))}" style="min-width:90px"/></td>
        <td><input class="form-input cat-plato-notas" value="${escHtml(actual?.notas || '')}" placeholder="Notas"/></td>
      </tr>`;
  }).join('') : emptyState('No se encontraron platos.');

  document.getElementById('catDecoracionesBody').innerHTML = decoraciones.length ? decoraciones.map(d => {
    const actual = decorMap.get(Number(d.id));
    const costo = actual?.costo_referencial ?? d.costo_referencial ?? '';
    return `
      <tr data-decoracion-id="${d.id}">
        <td><input type="checkbox" class="cat-decoracion-activo" ${actual?.activo !== false && actual ? 'checked' : ''}/></td>
        <td><strong>${escHtml(d.nombre)}</strong><br><span style="color:var(--txt-muted);font-size:12px">${escHtml(d.tipo || '')}</span></td>
        <td><input class="form-input cat-decoracion-costo" type="number" min="0" step="0.01" value="${escHtml(String(costo))}" style="min-width:90px"/></td>
        <td><input class="form-input cat-decoracion-notas" value="${escHtml(actual?.notas || '')}" placeholder="Notas"/></td>
      </tr>`;
  }).join('') : emptyState('No se encontraron decoraciones.');
}

async function guardarCatalogoProveedor() {
  if (!catalogoProveedorId) return;

  const platos = [...document.querySelectorAll('#catPlatosBody tr[data-plato-id]')]
    .filter(row => row.querySelector('.cat-plato-activo').checked)
    .map(row => ({
      plato_id: row.dataset.platoId,
      precio_referencial: row.querySelector('.cat-plato-precio').value,
      activo: true,
      notas: row.querySelector('.cat-plato-notas').value,
    }));

  const decoraciones = [...document.querySelectorAll('#catDecoracionesBody tr[data-decoracion-id]')]
    .filter(row => row.querySelector('.cat-decoracion-activo').checked)
    .map(row => ({
      decoracion_id: row.dataset.decoracionId,
      costo_referencial: row.querySelector('.cat-decoracion-costo').value,
      activo: true,
      notas: row.querySelector('.cat-decoracion-notas').value,
    }));

  const { error } = await proveedoresService.actualizarCatalogosProveedor(catalogoProveedorId, { platos, decoraciones });
  if (error) {
    Toast.error('No se pudo guardar el catálogo: ' + error);
    return;
  }

  Toast.success('Catálogo del proveedor actualizado ✓');
  cerrarCatalogo();
}

function exportarCSV() {
  const rows = [['ID','Nombre','Tipo','Contacto','Teléfono','Email','Estado']];
  todosLosProveedores.forEach(p => rows.push([p.id, p.nombre, p.tipo, p.contacto||'', p.telefono||'', p.email||'', p.estado]));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Proveedores');
  XLSX.writeFile(wb, 'proveedores.xlsx');
  Toast.success('Excel exportado ✓');
}

sessionReady.then(cargarProveedores);
