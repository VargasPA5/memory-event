<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory – Clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="js/theme.js"></script>
  <script src="js/logo.js"></script>
</head>
<body>
<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <main class="main" id="main">
    <div class="page-wrapper">

      <div class="page-header">
        <div>
          <h1>Clientes <span class="storage-indicator"><span class="storage-dot" id="storageDot"></span><span id="storageStatus">Guardado</span></span></h1>
          <p>Administra la información de tus clientes.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn--outline" onclick="exportarCSV()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            Exportar
          </button>
          <button class="btn btn--primary" onclick="abrirModal()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
            Nuevo Cliente
          </button>
        </div>
      </div>

      <!-- KPIs -->
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--blue"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v1h8v-1z"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kpiTotal">0</div><div class="kpi-label">Total Clientes</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--green"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kpiPersonas">0</div><div class="kpi-label">Personas</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--orange"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 110 2h-3a1 1 0 01-1-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 01-1 1H4a1 1 0 110-2V4z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kpiEmpresas">0</div><div class="kpi-label">Empresas</div></div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar por nombre o email…" oninput="renderTabla()"/>
        </div>
        <select class="filter-select" id="filtroTipo" onchange="renderTabla()">
          <option value="">Todos los tipos</option>
          <option>Persona</option>
          <option>Empresa</option>
        </select>
      </div>

      <!-- Tabla -->
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Tipo</th>
              <th>Dirección</th>
              <th>Registrado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
        <div class="tbl-pagination">
          <span id="paginacionInfo">—</span>
          <div class="pag-btns"><button class="pag-btn active">1</button></div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitulo">Nuevo Cliente</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Nombre *</label><input type="text" class="form-input" id="fNombre" placeholder="Nombre completo"/></div>
      <div class="form-group"><label>Tipo</label><select class="form-select" id="fTipo"><option>Persona</option><option>Empresa</option></select></div>
    </div>
    <div class="form-group"><label>Email *</label><input type="email" class="form-input" id="fEmail" placeholder="correo@ejemplo.com"/></div>
    <div class="form-row">
      <div class="form-group"><label>Teléfono</label><input type="text" class="form-input" id="fTelefono" placeholder="987 000 000"/></div>
      <div class="form-group"><label>Fecha de Nacimiento</label><input type="date" class="form-input" id="fFecha"/></div>
    </div>
    <div class="form-group"><label>Dirección</label><input type="text" class="form-input" id="fDireccion" placeholder="Dirección completa"/></div>
    <div class="modal-footer">
      <button class="btn btn--outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn--primary" onclick="guardarCliente()">Guardar Cliente</button>
    </div>
  </div>
</div>

<!-- Modal historial de boletas -->
<div class="modal-overlay" id="boletasClienteOverlay">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <h3>Historial de boletas</h3>
      <button class="modal-close" onclick="cerrarBoletasCliente()">✕</button>
    </div>
    <div id="boletasClienteList"></div>
    <div class="modal-footer">
      <button class="btn btn--outline" onclick="cerrarBoletasCliente()">Cerrar</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="js/boletas.js"></script>
<script type="module">
import * as clientesService from './js/services/clientesService.js';
import * as boletasService from './js/services/boletasService.js';

let editandoId = null;
let todosLosClientes = [];

/* ── Exposición Global para HTML ────────────────────────────────────── */
window.renderTabla = renderTabla;
window.abrirModal = abrirModal;
window.cerrarModal = cerrarModal;
window.guardarCliente = guardarCliente;
window.editarCliente = editarCliente;
window.pedirEliminar = pedirEliminar;
window.abrirBoletasCliente = abrirBoletasCliente;
window.cerrarBoletasCliente = cerrarBoletasCliente;
window.exportarCSV = exportarCSV;

/* ── Render y Carga ─────────────────────────────────────────────────── */
async function cargarClientes() {
  indicarGuardando(true);
  document.getElementById('storageStatus').textContent = 'Cargando...';
  const { data, error } = await clientesService.getAll();
  indicarGuardando(false);
  if (error) { Toast.error('Error al cargar clientes'); return; }
  todosLosClientes = data || [];
  renderTabla();
}

function renderTabla() {
  const txt   = (document.getElementById('searchInput').value || '').toLowerCase();
  const tipo  = document.getElementById('filtroTipo').value;
  const tbody = document.getElementById('tablaBody');

  const filtrados = todosLosClientes.filter(c =>
    (c.nombre.toLowerCase().includes(txt) || (c.email && c.email.toLowerCase().includes(txt))) &&
    (!tipo || c.tipo === tipo)
  );

  document.getElementById('kpiTotal').textContent    = todosLosClientes.length;
  document.getElementById('kpiPersonas').textContent = todosLosClientes.filter(c=>c.tipo==='Persona').length;
  document.getElementById('kpiEmpresas').textContent = todosLosClientes.filter(c=>c.tipo==='Empresa').length;
  document.getElementById('paginacionInfo').textContent = `Mostrando ${filtrados.length} de ${todosLosClientes.length} clientes`;

  tbody.innerHTML = '';
  if (!filtrados.length) { tbody.innerHTML = emptyState('No se encontraron clientes.'); return; }

  filtrados.forEach(c => {
    const tr = document.createElement('tr');
    const fechaReg = c.created_at ? Fmt.date(c.created_at) : '—';
    tr.innerHTML = `
      <td><div class="client-cell">${avatarEl(c.nombre, c.id)}<span class="fw-600"></span></div></td>
      <td class="c-email"></td>
      <td class="c-tel"></td>
      <td>${badge(c.tipo)}</td>
      <td class="c-dir"></td>
      <td>${fechaReg}</td>
      <td>
        <div class="actions">
          <button class="action-btn" title="Boletas" onclick="abrirBoletasCliente(${c.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h5.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm7 0v3a1 1 0 001 1h3l-4-4zM6 9a1 1 0 000 2h8a1 1 0 100-2H6zm0 4a1 1 0 100 2h5a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
          </button>
          <button class="action-btn" title="Editar" onclick="editarCliente(${c.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
          </button>
          <button class="action-btn delete" title="Eliminar" onclick="pedirEliminar(${c.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
          </button>
        </div>
      </td>`;
    tr.querySelector('.fw-600').textContent = c.nombre;
    tr.querySelector('.c-email').textContent = c.email || '—';
    tr.querySelector('.c-tel').textContent = c.telefono || '—';
    tr.querySelector('.c-dir').textContent = c.direccion || '—';
    tbody.appendChild(tr);
  });
}

/* ── Modal ──────────────────────────────────────────────────────────── */
function abrirModal() {
  editandoId = null;
  document.getElementById('modalTitulo').textContent = 'Nuevo Cliente';
  limpiarForm();
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
  setTimeout(() => document.getElementById('fNombre').focus(), 50);
}
function cerrarModal() {
  document.getElementById('modalOverlay').classList.remove('modal-overlay--open');
  limpiarForm();
}
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') cerrarModal(); });

function limpiarForm() {
  ['fNombre','fEmail','fTelefono','fFecha','fDireccion'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fTipo').value = 'Persona';
}

async function guardarCliente() {
  const nombre    = document.getElementById('fNombre').value.trim();
  const email     = document.getElementById('fEmail').value.trim();
  const tipo      = document.getElementById('fTipo').value;
  const telefono  = document.getElementById('fTelefono').value.trim();
  const fecha     = document.getElementById('fFecha').value;
  const direccion = document.getElementById('fDireccion').value.trim();

  if (!nombre) { Toast.error('El nombre es obligatorio'); return; }
  if (!email)  { Toast.error('El email es obligatorio'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { Toast.error('Email inválido'); return; }

  const dupEmail = todosLosClientes.find(c => c.email === email && c.id !== editandoId);
  if (dupEmail) { Toast.error('Ya existe un cliente con ese email'); return; }

  indicarGuardando(true);
  
  let result;
  if (editandoId !== null) {
    result = await clientesService.actualizar(editandoId, { nombre, email, tipo, telefono, fecha_nacimiento: fecha || null, direccion });
  } else {
    result = await clientesService.crear({ nombre, email, tipo, telefono, fecha_nacimiento: fecha || null, direccion });
  }

  if (result.error) {
    indicarGuardando(false);
    Toast.error('Error al guardar cliente: ' + result.error);
    return;
  }

  Toast.success(editandoId ? 'Cliente actualizado ✓' : 'Cliente guardado ✓');
  cerrarModal();
  await cargarClientes();
}

function editarCliente(id) {
  const c = todosLosClientes.find(x => x.id === id);
  if (!c) return;
  editandoId = id;
  document.getElementById('modalTitulo').textContent = 'Editar Cliente';
  document.getElementById('fNombre').value    = c.nombre || '';
  document.getElementById('fEmail').value     = c.email || '';
  document.getElementById('fTipo').value      = c.tipo || 'Persona';
  document.getElementById('fTelefono').value  = c.telefono || '';
  document.getElementById('fFecha').value     = c.fecha_nacimiento || '';
  document.getElementById('fDireccion').value = c.direccion || '';
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
  setTimeout(() => document.getElementById('fNombre').focus(), 50);
}

async function pedirEliminar(id) {
  const { data: dep, error } = await clientesService.getDependencias(id);
  if (error) { Toast.error('Error al verificar dependencias'); return; }
  
  const partes = [];
  if (dep.eventos)  partes.push(`${dep.eventos} evento${dep.eventos>1?'s':''}`);
  if (dep.reservas) partes.push(`${dep.reservas} reserva${dep.reservas>1?'s':''}`);
  
  if (partes.length) {
    Toast.warning(`No se puede eliminar: tiene ${partes.join(', ')} asociados`);
    return;
  }
  const ok = await Confirm({ title:'¿Eliminar cliente?', message:'Esta acción no se puede deshacer. El cliente será eliminado permanentemente.', okText:'Sí, eliminar' });
  if (!ok) return;
  
  indicarGuardando(true);
  const delRes = await clientesService.eliminar(id);
  indicarGuardando(false);
  
  if (delRes.error) { Toast.error('Error al eliminar o permisos insuficientes'); return; }
  
  Toast.success('Cliente eliminado');
  await cargarClientes();
}

/* ── Historial de boletas ──────────────────────────────────────────── */
async function abrirBoletasCliente(clienteId) {
  const list = document.getElementById('boletasClienteList');
  list.innerHTML = `<p style="font-size:13px;color:var(--txt-muted);padding:16px 0;text-align:center">Cargando boletas...</p>`;
  document.getElementById('boletasClienteOverlay').classList.add('modal-overlay--open');

  const { data: boletas, error } = await boletasService.getByCliente(clienteId);
  if (error) {
    list.innerHTML = `<p style="font-size:13px;color:var(--red);padding:16px 0;text-align:center">No se pudieron cargar las boletas.</p>`;
    Toast.error('Error al cargar boletas');
    return;
  }

  if (!boletas.length) {
    list.innerHTML = `<p style="font-size:13px;color:var(--txt-muted);padding:16px 0;text-align:center">Este cliente aún no tiene boletas registradas.</p>`;
  } else {
    list.innerHTML = `<table class="report-table">
      <thead><tr><th>N°</th><th>Fecha</th><th>Evento</th><th>Total</th><th>Pagado</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody>${boletas.map(b => `
        <tr>
          <td><strong>${escHtml(b.numero)}</strong></td>
          <td>${Fmt.date(b.fecha)}</td>
          <td>${escHtml(b.evento?.nombre || '—')}</td>
          <td>${Fmt.currency(b.total)}</td>
          <td style="color:var(--green)">${Fmt.currency(b.monto_pagado)}</td>
          <td>${badge(b.estado)}</td>
          <td>
            <div class="actions">
              <button class="action-btn" title="Ver" onclick="abrirPreviewBoletaCliente(${b.id})">
                <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
              </button>
              <button class="action-btn" title="Descargar PDF" onclick="descargarBoletaCliente(${b.id})">
                <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
              </button>
            </div>
          </td>
        </tr>`).join('')}</tbody>
    </table>`;
  }
}

window.abrirPreviewBoletaCliente = async (boletaId) => {
  const { data, error } = await boletasService.getById(boletaId);
  if (error || !data) { Toast.error('No se pudo cargar la boleta'); return; }
  Boletas.abrirPreview(data);
};

window.descargarBoletaCliente = async (boletaId) => {
  const { data, error } = await boletasService.getById(boletaId);
  if (error || !data) { Toast.error('No se pudo cargar la boleta'); return; }
  Boletas.descargarPDF(data);
};
function cerrarBoletasCliente() {
  document.getElementById('boletasClienteOverlay').classList.remove('modal-overlay--open');
}
document.getElementById('boletasClienteOverlay').addEventListener('click', e => { if (e.target.id === 'boletasClienteOverlay') cerrarBoletasCliente(); });

/* ── Excel export ───────────────────────────────────────────────────── */
function exportarCSV() {
  const rows = [['ID','Nombre','Email','Teléfono','Tipo','Dirección','Registrado']];
  todosLosClientes.forEach(c => rows.push([c.id, c.nombre, c.email, c.telefono||'', c.tipo, c.direccion||'', c.created_at?Fmt.date(c.created_at):'']));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Clientes');
  XLSX.writeFile(wb, 'clientes.xlsx');
  Toast.success('Excel exportado ✓');
}

/* ── Storage indicator ──────────────────────────────────────────────── */
function indicarGuardando(saving) {
  const dot = document.getElementById('storageDot');
  const lbl = document.getElementById('storageStatus');
  if (saving) { dot.className='storage-dot saving'; lbl.textContent='Guardando…'; }
  else        { dot.className='storage-dot'; lbl.textContent='Guardado ✓'; }
}

/* ── Init ───────────────────────────────────────────────────────────── */
cargarClientes();
</script>
</body>
</html>
