<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory – Reservas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="js/theme.js"></script>
  <script src="js/logo.js"></script>
</head>
<body>
<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <main class="main" id="main">
    <div class="page-wrapper">

      <div class="page-header">
        <div><h1>Reservas</h1><p>Gestiona las reservas de salones y servicios.</p></div>
        <div class="page-actions">
          <button class="btn btn--outline" onclick="exportarCSV()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
            Exportar
          </button>
          <button class="btn btn--primary" onclick="abrirModal()">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
            Nueva Reserva
          </button>
        </div>
      </div>

      <!-- KPIs -->
      <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--blue"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kTotal">—</div><div class="kpi-label">Total Reservas</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--green"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kConfirmadas">—</div><div class="kpi-label">Confirmadas</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--yellow"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kPendientes">—</div><div class="kpi-label">Pendientes</div></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-top"><div class="kpi-icon kpi-icon--red"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg></div></div>
          <div class="kpi-bottom"><div class="kpi-value" id="kCanceladas">—</div><div class="kpi-label">Canceladas</div></div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar reserva…" oninput="renderTabla()"/>
        </div>
        <select class="filter-select" id="filtroEstado" onchange="renderTabla()">
          <option value="">Todos los estados</option>
          <option>Confirmado</option><option>Pendiente</option><option>Cancelado</option>
        </select>
      </div>

      <!-- Tabla -->
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr><th>Código</th><th>Evento</th><th>Cliente</th><th>Fecha</th><th>Estado</th><th>Total</th><th>Adelanto</th><th>Saldo</th><th>Acciones</th></tr>
          </thead>
          <tbody id="tablaBody"></tbody>
        </table>
        <div class="tbl-pagination">
          <span id="paginacionInfo">—</span>
          <div class="pag-btns"><button class="pag-btn active">1</button></div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitulo">Nueva Reserva</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Cliente</label><select class="form-select" id="fCliente"></select></div>
      <div class="form-group"><label>Evento</label><select class="form-select" id="fEvento" onchange="onEventoChange()"></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Fecha</label><input type="date" class="form-input" id="fFecha"/></div>
      <div class="form-group"><label>Estado</label><select class="form-select" id="fEstado"><option>Confirmado</option><option>Pendiente</option><option>Cancelado</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Total (S/)</label><input type="number" class="form-input" id="fTotal" placeholder="0.00" oninput="calcularSaldo()"/></div>
      <div class="form-group"><label>Adelanto (S/)</label><input type="number" class="form-input" id="fAdelanto" placeholder="0.00" oninput="calcularSaldo()"/></div>
    </div>
    <div class="form-group"><label>Saldo (S/) — calculado automáticamente</label><input type="number" class="form-input" id="fSaldo" placeholder="0.00" readonly style="background:#f8fafc;color:var(--txt-muted)"/></div>
    <div class="form-group"><label>Notas</label><textarea class="form-input form-textarea" id="fNotas" rows="2" placeholder="Observaciones adicionales…"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn--outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn--primary" onclick="guardarReserva()">Guardar Reserva</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
let editandoId = null;

function poblarSelects() {
  const selCl = document.getElementById('fCliente');
  const selEv = document.getElementById('fEvento');
  selCl.innerHTML = '<option value="">— Seleccionar —</option>';
  selEv.innerHTML = '<option value="">— Seleccionar —</option>';
  Data.clientes.getAll().forEach(c => {
    const o = document.createElement('option'); o.value = c.id; o.textContent = c.nombre; selCl.appendChild(o);
  });
  Data.eventos.getAll().forEach(e => {
    const o = document.createElement('option'); o.value = e.id; o.textContent = e.nombre; selEv.appendChild(o);
  });
}

function onEventoChange() {
  const evId = parseInt(document.getElementById('fEvento').value);
  const ev = Data.eventos.find(evId);
  if (ev) {
    document.getElementById('fFecha').value = ev.fecha || '';
    document.getElementById('fCliente').value = ev.clienteId || '';
    if (ev.presupuesto) document.getElementById('fTotal').value = ev.presupuesto;
    calcularSaldo();
  }
}

function calcularSaldo() {
  const total   = parseFloat(document.getElementById('fTotal').value)   || 0;
  const adelanto= parseFloat(document.getElementById('fAdelanto').value) || 0;
  document.getElementById('fSaldo').value = Math.max(0, total - adelanto).toFixed(2);
}

function nextCodigo() {
  const reservas = Data.reservas.getAll();
  const max = reservas.reduce((m, r) => Math.max(m, parseInt((r.codigo||'RES-000').split('-')[1]||0)), 0);
  return 'RES-' + String(max+1).padStart(3,'0');
}

function renderTabla() {
  const txt    = (document.getElementById('searchInput').value||'').toLowerCase();
  const estado = document.getElementById('filtroEstado').value;
  const tbody  = document.getElementById('tablaBody');

  const todos = Data.reservas.getAll();
  const filtrados = todos.filter(r => {
    const nom = (Data.eventoNombre(r.eventoId)+' '+Data.clienteNombre(r.clienteId)+' '+(r.codigo||'')).toLowerCase();
    return nom.includes(txt) && (!estado || r.estado === estado);
  });

  document.getElementById('kTotal').textContent      = todos.length;
  document.getElementById('kConfirmadas').textContent = todos.filter(r=>r.estado==='Confirmado').length;
  document.getElementById('kPendientes').textContent  = todos.filter(r=>r.estado==='Pendiente').length;
  document.getElementById('kCanceladas').textContent  = todos.filter(r=>r.estado==='Cancelado').length;
  document.getElementById('paginacionInfo').textContent = `Mostrando ${filtrados.length} de ${todos.length} reservas`;

  tbody.innerHTML = '';
  if (!filtrados.length) { tbody.innerHTML = emptyState('No se encontraron reservas.'); return; }

  filtrados.sort((a,b) => new Date(b.createdAt||0)-new Date(a.createdAt||0)).forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong class="r-codigo"></strong></td>
      <td class="r-evento"></td>
      <td><div class="client-cell">${avatarEl(Data.clienteNombre(r.clienteId), r.clienteId)}<span class="r-cliente"></span></div></td>
      <td>${Fmt.dateShort(r.fecha)}</td>
      <td>${badge(r.estado)}</td>
      <td><strong>${Fmt.currency(r.total)}</strong></td>
      <td>${Fmt.currency(r.adelanto)}</td>
      <td><strong style="color:${r.saldo>0?'var(--red)':'var(--green)'}">${Fmt.currency(r.saldo)}</strong></td>
      <td>
        <div class="actions">
          <button class="action-btn" title="Editar" onclick="editarReserva(${r.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
          </button>
          <button class="action-btn delete" title="Eliminar" onclick="pedirEliminar(${r.id})">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
          </button>
        </div>
      </td>`;
    tr.querySelector('.r-codigo').textContent  = r.codigo || '—';
    tr.querySelector('.r-evento').textContent  = Data.eventoNombre(r.eventoId);
    tr.querySelector('.r-cliente').textContent = Data.clienteNombre(r.clienteId);
    tbody.appendChild(tr);
  });
}

function abrirModal() {
  editandoId = null;
  document.getElementById('modalTitulo').textContent = 'Nueva Reserva';
  limpiarForm();
  poblarSelects();
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
}
function cerrarModal() { document.getElementById('modalOverlay').classList.remove('modal-overlay--open'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id === 'modalOverlay') cerrarModal(); });

function limpiarForm() {
  ['fFecha','fTotal','fAdelanto','fSaldo','fNotas'].forEach(id => document.getElementById(id).value='');
  document.getElementById('fEstado').selectedIndex=0;
}

function guardarReserva() {
  const clienteId = parseInt(document.getElementById('fCliente').value)||null;
  const eventoId  = parseInt(document.getElementById('fEvento').value)||null;
  const fecha     = document.getElementById('fFecha').value;
  const estado    = document.getElementById('fEstado').value;
  const total     = parseFloat(document.getElementById('fTotal').value)||0;
  const adelanto  = parseFloat(document.getElementById('fAdelanto').value)||0;
  const saldo     = Math.max(0, total - adelanto);
  const notas     = document.getElementById('fNotas').value.trim();

  if (!clienteId)  { Toast.error('Selecciona un cliente'); return; }
  if (!eventoId)   { Toast.error('Selecciona un evento'); return; }
  if (!fecha)      { Toast.error('La fecha es obligatoria'); return; }
  if (total <= 0)  { Toast.error('El total debe ser mayor a 0'); return; }
  if (adelanto < 0){ Toast.error('El adelanto no puede ser negativo'); return; }
  if (adelanto > total) { Toast.error('El adelanto no puede superar el total'); return; }

  if (editandoId !== null) {
    Data.reservas.update(editandoId, { clienteId, eventoId, fecha, estado, total, adelanto, saldo, notas });
    Toast.success('Reserva actualizada ✓');
  } else {
    Data.reservas.create({ codigo: nextCodigo(), clienteId, eventoId, fecha, estado, total, adelanto, saldo, notas });
    Toast.success('Reserva guardada ✓');
  }
  cerrarModal();
  renderTabla();
}

function editarReserva(id) {
  const r = Data.reservas.find(id);
  if (!r) return;
  editandoId = id;
  poblarSelects();
  document.getElementById('modalTitulo').textContent = 'Editar Reserva';
  document.getElementById('fCliente').value  = r.clienteId || '';
  document.getElementById('fEvento').value   = r.eventoId  || '';
  document.getElementById('fFecha').value    = r.fecha || '';
  document.getElementById('fEstado').value   = r.estado;
  document.getElementById('fTotal').value    = r.total || '';
  document.getElementById('fAdelanto').value = r.adelanto || '';
  document.getElementById('fSaldo').value    = r.saldo || '';
  document.getElementById('fNotas').value    = r.notas || '';
  document.getElementById('modalOverlay').classList.add('modal-overlay--open');
}

async function pedirEliminar(id) {
  const dep = Data.depReserva(id);
  if (dep.ingresos) {
    Toast.warning(`No se puede eliminar: tiene ${dep.ingresos} pago${dep.ingresos>1?'s':''} registrados`);
    return;
  }
  const ok = await Confirm({ title:'¿Eliminar reserva?', message:'Esta acción no se puede deshacer.', okText:'Sí, eliminar' });
  if (!ok) return;
  Data.reservas.delete(id);
  renderTabla();
  Toast.success('Reserva eliminada');
}

function exportarCSV() {
  const rows = [['Código','Evento','Cliente','Fecha','Estado','Total','Adelanto','Saldo']];
  Data.reservas.getAll().forEach(r => rows.push([r.codigo||'',`"${Data.eventoNombre(r.eventoId)}"`,`"${Data.clienteNombre(r.clienteId)}"`,r.fecha,r.estado,r.total||0,r.adelanto||0,r.saldo||0]));
  const csv = rows.map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('﻿'+csv);
  a.download = 'reservas.csv'; a.click();
  Toast.success('CSV exportado ✓');
}

renderTabla();
</script>
</body>
</html>
