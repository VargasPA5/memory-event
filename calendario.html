<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory - Calendario Operativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script src="js/theme.js"></script>
  <script src="js/logo.js"></script>
  <style>
    .op-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
    .op-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
    .op-nav{display:flex;align-items:center;gap:8px}
    .op-title{min-width:220px;text-align:center;font-size:18px;font-weight:700}
    .op-tabs{display:flex;gap:4px;align-items:center}
    .op-filters{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:8px;margin-bottom:12px}
    .op-filter-checks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .op-filter-checks label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt-secondary);background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:8px 10px}
    .op-month{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);overflow:hidden}
    .op-day-name{padding:10px;text-align:center;font-size:11.5px;font-weight:700;color:var(--txt-muted);text-transform:uppercase;border-bottom:1px solid var(--card-border)}
    .op-day{min-height:128px;padding:8px;border-right:1px solid var(--card-border);border-bottom:1px solid var(--card-border);background:var(--card-bg)}
    .op-day:nth-child(7n+7){border-right:none}
    .op-day header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .op-day header span{font-size:12px;font-weight:700;color:var(--txt-secondary)}
    .op-day header strong{font-size:11px;color:var(--txt-muted)}
    .op-day--muted{background:var(--main-bg);opacity:.65}
    .op-day--today header span{background:var(--accent);color:#1a1917;border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center}
    .op-day__events{display:flex;flex-direction:column;gap:4px}
    .op-event{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;border:0;border-left:3px solid var(--accent);border-radius:6px;padding:5px 7px;color:var(--txt-primary);cursor:pointer;text-align:left;min-height:28px}
    .op-event:hover{filter:brightness(.98)}
    .op-event__time{font-size:10.5px;color:var(--txt-muted)}
    .op-event__title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .op-event__alerts{display:flex;gap:3px}
    .op-alert{width:7px;height:7px;border-radius:50%;display:inline-block}
    .op-alert--critica{background:var(--red)}
    .op-alert--advertencia{background:var(--yellow)}
    .op-alert--info{background:var(--blue)}
    .op-more{font-size:11px;color:var(--txt-muted);padding:2px 4px}
    .op-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    .op-week-day{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);min-height:380px;padding:10px}
    .op-week-day header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px}
    .op-agenda{display:flex;flex-direction:column;gap:8px}
    .op-agenda-item{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:10px}
    .op-agenda-item p{font-size:12px;color:var(--txt-muted);margin-top:6px}
    .op-empty,.op-muted{font-size:12px;color:var(--txt-muted)}
    .op-upcoming{width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--card-border);background:transparent;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
    .op-upcoming:hover{background:var(--main-bg)}
    .op-upcoming strong{font-size:13px}
    .op-upcoming span,.op-summary-row span{font-size:12px;color:var(--txt-muted)}
    .op-summary-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
    .op-panel{position:fixed;top:0;right:0;width:min(440px,100vw);height:100vh;background:var(--card-bg);border-left:1px solid var(--card-border);box-shadow:var(--shadow-lg);z-index:260;transform:translateX(105%);transition:transform var(--t);display:flex;flex-direction:column}
    .op-panel.open{transform:translateX(0)}
    .op-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px;border-bottom:1px solid var(--card-border)}
    .op-panel-head span{font-size:12px;color:var(--txt-muted)}
    .op-panel-head h3{font-size:18px;font-weight:700;margin-top:3px}
    .op-panel-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
    .op-panel-loading{padding:24px;color:var(--txt-muted)}
    .op-panel-section{border:1px solid var(--card-border);border-radius:8px;padding:12px;background:var(--main-bg)}
    .op-panel-section h4{font-size:13px;font-weight:700;margin-bottom:8px}
    .op-panel-summary p{font-size:12.5px;color:var(--txt-secondary);margin-top:5px}
    .op-money-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .op-money-grid div{background:var(--card-bg);border:1px solid var(--card-border);border-radius:6px;padding:8px}
    .op-money-grid span{display:block;font-size:11px;color:var(--txt-muted);margin-bottom:2px}
    .op-line{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--card-border);text-decoration:none;color:inherit}
    .op-line:last-child{border-bottom:0}
    .op-line strong{font-size:12.5px}
    .op-line span{font-size:12px;color:var(--txt-muted)}
    .op-check{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0}
    .op-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    @media(max-width:1100px){.op-layout{grid-template-columns:1fr}.op-filters{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.op-filters{grid-template-columns:1fr}.op-month{display:block}.op-day-name{display:none}.op-day{min-height:auto;border-right:0}.op-week{grid-template-columns:1fr}.op-title{text-align:left;min-width:auto}.op-actions{grid-template-columns:1fr}}
  </style>
</head>
<body class="app-page app-page--calendario">
<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <main class="main" id="main">
    <div class="page-wrapper">
      <div class="page-header">
        <div>
          <h1>Calendario Operativo <span class="storage-indicator"><span class="storage-dot" id="calendarDot"></span><span id="calendarStatus">Actualizado</span></span></h1>
          <p>Planifica eventos, reservas, pagos, proveedores, agenda y pendientes desde una sola vista.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn--outline" id="btnHoy">Hoy</button>
          <a href="eventos.html" class="btn btn--primary">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
            Nuevo Evento
          </a>
        </div>
      </div>

      <div class="op-toolbar">
        <div class="op-nav">
          <button class="cal-nav-btn" id="btnPrev"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/></svg></button>
          <div class="op-title" id="periodTitle">-</div>
          <button class="cal-nav-btn" id="btnNext"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg></button>
        </div>
        <div class="op-tabs">
          <button class="cal-tab" data-view="mes">Mes</button>
          <button class="cal-tab" data-view="semana">Semana</button>
          <button class="cal-tab" data-view="dia">Día</button>
          <button class="cal-tab" data-view="agenda">Agenda</button>
        </div>
      </div>

      <div class="op-filters">
        <select class="filter-select" id="fEstado"><option value="">Todos los estados</option><option>Pendiente</option><option>Confirmado</option><option>Realizado</option><option>Cancelado</option></select>
        <select class="filter-select" id="fTipo"></select>
        <select class="filter-select" id="fCliente"></select>
        <select class="filter-select" id="fProveedor"></select>
        <select class="filter-select" id="fPlanificador"></select>
      </div>
      <div class="op-filter-checks">
        <label><input type="checkbox" id="f_pagosPendientes"/> Pagos pendientes</label>
        <label><input type="checkbox" id="f_saldoPendiente"/> Saldo pendiente</label>
        <label><input type="checkbox" id="f_sinProveedor"/> Sin proveedor</label>
        <label><input type="checkbox" id="f_sinReserva"/> Sin reserva</label>
        <label><input type="checkbox" id="f_checklistIncompleto"/> Checklist incompleto</label>
        <label><input type="checkbox" id="f_conAnexos"/> Con anexos</label>
        <label><input type="checkbox" id="f_conComentarios"/> Con comentarios</label>
        <label><input type="checkbox" id="f_conAgenda"/> Con agenda</label>
        <button class="btn btn--outline" id="btnLimpiarFiltros" type="button">Limpiar filtros</button>
      </div>

      <div class="op-layout">
        <div id="calendarCanvas"></div>
        <aside>
          <div class="card" style="margin-bottom:12px">
            <div class="card-header"><h3>Próximos eventos</h3><a href="eventos.html" class="link-sm">Ver todos</a></div>
            <div id="upcomingList"></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Resumen visible</h3></div>
            <div class="card-body"><div style="display:flex;flex-direction:column;gap:10px" id="mesResumen"></div></div>
          </div>
        </aside>
      </div>
    </div>
  </main>
</div>

<aside class="op-panel" id="calendarPanel" aria-live="polite"></aside>
<div id="toast-container"></div>

<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script type="module">
import { sessionReady } from './js/supabaseClient.js';
import * as calendarioService from './js/services/calendarioService.js';
import { state, setView, movePeriod, goToday, getVisibleRange, toISODate } from './js/calendar/calendarState.js';
import { initFilters, populateFilterOptions } from './js/calendar/calendarFilters.js';
import { renderCalendar } from './js/calendar/calendarViews.js';
import { openPanelLoading, renderPanel, closePanel } from './js/calendar/calendarPanel.js';
import { createCalendarRealtime } from './js/calendar/calendarRealtime.js';

const realtime = createCalendarRealtime();

function setLoading(loading) {
  const dot = document.getElementById('calendarDot');
  const status = document.getElementById('calendarStatus');
  dot?.classList.toggle('saving', loading);
  if (status) status.textContent = loading ? 'Cargando...' : 'Actualizado';
}

async function cargarEventos() {
  setLoading(true);
  const { start, end } = getVisibleRange();
  const { data, error } = await calendarioService.getEventos({
    desde: toISODate(start),
    hasta: toISODate(end),
    filtros: state.filtros,
  });
  setLoading(false);
  if (error) {
    Toast.error('Error al cargar calendario: ' + error);
    return;
  }
  state.eventos = data || [];
  renderCalendar(abrirDetalle);
}

async function abrirDetalle(eventoId) {
  state.selectedEventId = eventoId;
  openPanelLoading();
  const { data, error } = await calendarioService.getEventoDetalle(eventoId);
  if (error) {
    Toast.error('Error al cargar detalle del evento: ' + error);
    closePanel();
    return;
  }
  renderPanel(data);
}

async function cargarOpciones() {
  const { data, error } = await calendarioService.getOpcionesFiltros();
  if (error) {
    Toast.warning('No se pudieron cargar todos los filtros');
    return;
  }
  populateFilterOptions(data);
}

document.getElementById('btnPrev').addEventListener('click', () => { movePeriod(-1); cargarEventos(); });
document.getElementById('btnNext').addEventListener('click', () => { movePeriod(1); cargarEventos(); });
document.getElementById('btnHoy').addEventListener('click', () => { goToday(); cargarEventos(); });
document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    setView(btn.dataset.view);
    cargarEventos();
  });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
});

// Espera a que supabase-js termine de restaurar la sesión guardada antes de
// pedir datos: si la consulta sale antes de tiempo, viaja sin token y la
// base de datos no devuelve ningún evento (ver mismo problema ya resuelto
// en usuarios.html / app.js — aquí nunca se había corregido).
await sessionReady;
await cargarOpciones();
initFilters(cargarEventos);
renderCalendar(abrirDetalle);
cargarEventos();

window.addEventListener('beforeunload', () => realtime.stop());
</script>
</body>
</html>
