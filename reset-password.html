<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory — Restablecer contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
  <script src="js/logo.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 75% 10%, rgba(201,163,90,.10), transparent 26rem),
        linear-gradient(135deg, #f7f6f3 0%, #efede8 100%);
      color: #171511;
      padding: 24px;
    }
    .rp-card {
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 46px 42px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 70px rgba(31,27,20,.13), 0 1px 3px rgba(31,27,20,.05);
      border: 1px solid rgba(229,225,218,.78);
      text-align: center;
    }
    .rp-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 26px; }
    .rp-brand-icon {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, #d9b978, #9e7528);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 24px rgba(201,163,90,.28);
    }
    .rp-brand-name { font-size: 22px; font-weight: 700; font-family: 'Dancing Script', cursive; color: #1a1917; }
    .card-title { font-size: 24px; font-weight: 750; color: #171511; margin-bottom: 6px; letter-spacing: -.03em; }
    .card-sub { font-size: 13.5px; color: #6f6a61; margin-bottom: 26px; line-height: 1.5; }

    .login-error {
      display: none; background: #fef2f2; border: 1px solid #fecaca; border-radius: 13px;
      padding: 10px 14px; font-size: 13px; color: #dc2626; margin-bottom: 18px;
      align-items: center; gap: 8px; text-align: left;
    }
    .login-error.show { display: flex; }
    .login-error svg { width: 16px; height: 16px; flex-shrink: 0; }

    .form-group { margin-bottom: 18px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #6b6a64; margin-bottom: 6px; }
    .form-input {
      width: 100%; padding: 12px 14px; border: 1px solid #e5e1da; border-radius: 13px;
      font-size: 14px; font-family: inherit; color: #1a1917; background: #fff; outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .form-input:focus { border-color: #c9a35a; box-shadow: 0 0 0 4px rgba(201,163,90,.18); background: #fffdf9; }
    .input-wrap { position: relative; }
    .input-wrap .form-input { padding-right: 42px; }
    .pwd-toggle {
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #9a9890; display: flex; align-items: center; padding: 4px;
    }
    .pwd-toggle:hover { color: #6b6a64; }
    .pwd-toggle svg { width: 18px; height: 18px; }

    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #c9a35a, #b3893f);
      color: #1a1917; border: none; border-radius: 14px;
      font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
      margin-top: 4px; box-shadow: 0 10px 24px rgba(201,163,90,.25);
      transition: box-shadow .15s, transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover { box-shadow: 0 14px 30px rgba(201,163,90,.34); transform: translateY(-1px); }
    .btn-login:active { transform: scale(.98); box-shadow: none; }
    .btn-login:disabled { opacity: .55; cursor: not-allowed; }
    .btn-login svg { width: 18px; height: 18px; }

    .rp-icon-wrap { width: 56px; height: 56px; border-radius: 50%; background: #fef2f2; color: #dc2626; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
    .rp-icon-wrap svg { width: 28px; height: 28px; }
    .rp-link { display: inline-block; margin-top: 8px; font-size: 13px; color: #b3893f; font-weight: 600; text-decoration: none; }
    .rp-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="rp-card" id="rpCard">
    <div class="rp-brand">
      <div class="rp-brand-icon">
        <svg width="24" height="24" viewBox="0 0 40 40" fill="none">
          <path d="M8,31 C8,19 10,11 14,10 C16,9 18,15 20,23 C22,31 25,9 28,10 C31,11 33,21 33,31" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <span class="rp-brand-name">Memory</span>
    </div>
    <div id="rpContent">
      <p style="color:#9a9890;font-size:13.5px">Verificando enlace…</p>
    </div>
  </div>

<script src="js/auth.js"></script>
<script>
  AppLogo.paintInto('.rp-brand-icon');
</script>
<script type="module">
  import { supabase } from './js/supabaseClient.js';

  const content = document.getElementById('rpContent');

  function renderInvalido() {
    content.innerHTML = `
      <div class="rp-icon-wrap">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
      </div>
      <div class="card-title">Enlace no válido</div>
      <p class="card-sub">Este enlace de recuperación ya expiró o no es válido. Solicita uno nuevo desde la pantalla de inicio de sesión.</p>
      <a class="rp-link" href="login.html">← Volver a iniciar sesión</a>`;
  }

  function renderFormulario() {
    content.innerHTML = `
      <div class="card-title" style="text-align:left">Nueva contraseña</div>
      <p class="card-sub" style="text-align:left">Elige la contraseña con la que ingresarás al sistema</p>
      <div id="rpError" class="login-error">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
        <span id="rpErrorMsg"></span>
      </div>
      <div class="form-group">
        <label for="rpPass">Nueva contraseña</label>
        <div class="input-wrap">
          <input type="password" id="rpPass" class="form-input" placeholder="Mínimo 6 caracteres" autocomplete="new-password"/>
          <button type="button" class="pwd-toggle" id="rpTogglePwd" tabindex="-1">
            <svg id="rpEyeOpen" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
            <svg id="rpEyeOff" style="display:none" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd"/><path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.064 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="rpConfirmar">Confirmar contraseña</label>
        <input type="password" id="rpConfirmar" class="form-input" placeholder="••••••••" autocomplete="new-password"/>
      </div>
      <button class="btn-login" id="rpBtn">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg>
        Guardar contraseña
      </button>`;

    document.getElementById('rpTogglePwd').addEventListener('click', () => {
      const inp = document.getElementById('rpPass');
      const isText = inp.type === 'text';
      inp.type = isText ? 'password' : 'text';
      document.getElementById('rpEyeOpen').style.display = isText ? '' : 'none';
      document.getElementById('rpEyeOff').style.display  = isText ? 'none' : '';
    });

    document.getElementById('rpConfirmar').addEventListener('keydown', e => { if (e.key === 'Enter') guardarNuevaPassword(); });
    document.getElementById('rpBtn').addEventListener('click', guardarNuevaPassword);
  }

  function mostrarError(msg) {
    const el = document.getElementById('rpError');
    if (!el) return;
    document.getElementById('rpErrorMsg').textContent = msg;
    el.classList.add('show');
  }

  async function guardarNuevaPassword() {
    document.getElementById('rpError')?.classList.remove('show');
    const pass = document.getElementById('rpPass').value;
    const conf = document.getElementById('rpConfirmar').value;
    if (!pass || pass.length < 6) { mostrarError('La contraseña debe tener al menos 6 caracteres'); return; }
    if (pass !== conf) { mostrarError('Las contraseñas no coinciden'); return; }

    const btn = document.getElementById('rpBtn');
    btn.disabled = true;
    const textoOriginal = btn.innerHTML;
    btn.innerHTML = '<svg viewBox="0 0 20 20" fill="currentColor" style="animation:spin .8s linear infinite"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg> Guardando...';

    const { error } = await supabase.auth.updateUser({ password: pass });
    if (error) {
      mostrarError(error.message || 'No se pudo actualizar la contraseña');
      btn.disabled = false;
      btn.innerHTML = textoOriginal;
      return;
    }

    // Se cierra la sesión temporal que abrió el enlace de recuperación:
    // el usuario entra de nuevo con su contraseña nueva, en vez de quedar
    // autenticado automáticamente — así el flujo termina donde el
    // administrador lo pidió: de vuelta en el login. Auth.clear() borra
    // también la caché local de sesión (sessionStorage) — si no, un
    // login.html previamente abierto en esta pestaña seguiría creyendo
    // que hay sesión activa y saltaría directo al dashboard.
    Auth.clear();
    await supabase.auth.signOut();
    window.location.replace('login.html?resetOk=1');
  }

  (async () => {
    // El enlace de recuperación llega con un token en el hash de la URL;
    // el cliente de Supabase (detectSessionInUrl, en supabaseClient.js) lo
    // procesa apenas se crea el cliente, de forma asíncrona — por eso se
    // espera getSession() antes de decidir qué mostrar.
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { renderInvalido(); return; }
    renderFormulario();
  })();
</script>
</body>
</html>
